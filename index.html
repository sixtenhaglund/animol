let toLoad = 0, loaded = 0;

function loadImage(md5) {
  const img = new Image();
  toLoad++;
  img.onload = img.onerror = () => { loaded++; };
  img.src = "assets/" + md5 + ".png";
  return img;
}
const imgCache = {};
function img(md5) { return imgCache[md5] || (imgCache[md5] = loadImage(md5)); }
for (const sprite in COSTUMES) {
  COST[sprite] = {};
  COSTUMES[sprite].forEach(([name, md5, cx, cy], i) => { COST[sprite][name] = COST[sprite][i] = { img: img(md5), cx, cy }; });
}
for (const b in BACKDROPS) BACK[b] = img(BACKDROPS[b]);

function resize() {
  const k = Math.min(window.innerWidth / 480, window.innerHeight / 360);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = Math.floor(480 * k) + "px";
  canvas.style.height = Math.floor(360 * k) + "px";
  canvas.width = Math.round(480 * k * dpr);
  canvas.height = Math.round(360 * k * dpr);
  viewScale = canvas.width / 480;
}
window.addEventListener("resize", resize);
resize();

// Scratch-style drawing: (x, y) is where the costume's rotation center goes,
// size is a percent like the "set size to" block, dir is Scratch direction (90 = right).
function drawCostume(c, x, y, size, dir = 90, alpha = 1) {
  if (!c || !c.img.width) return;
  const s = size / 100 / 2;              // /2 because his PNGs are bitmapResolution 2
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, -y);
  if (dir !== 90) ctx.rotate((dir - 90) * Math.PI / 180);
  ctx.drawImage(c.img, -c.cx * s, -c.cy * s, c.img.width * s, c.img.height * s);
  ctx.restore();
}
// Bounding box (stage coords, y up) of an unrotated costume, for clicks
function costumeBox(c, x, y, size) {
  const s = size / 100 / 2;
  const left = x - c.cx * s, top = y + c.cy * s;
  return { left, right: left + c.img.width * s, top, bottom: top - c.img.height * s };
}
// Rough "radius" of a costume, used for touching checks
function costumeRadius(c, size) {
  const s = size / 100 / 2;
  return Math.min(c.img.width, c.img.height) * s * 0.42;
}

function textWidth(str, px) { return str.length * 6 * px - px; }
// align: 0 = left, 0.5 = center, 1 = right. (x, y) is the top edge in stage coords.
function pixelText(str, x, y, px, color, align = 0.5, shadow = "rgba(0,0,0,.55)") {
  str = String(str).toUpperCase();
  const x0 = x - textWidth(str, px) * align;
  const pass = (ox, oy, col) => {
    ctx.fillStyle = col;
    for (let i = 0; i < str.length; i++) {
      const g = FONT[str[i]] || FONT["?"];
      for (let r = 0; r < 7; r++) for (let b = 0; b < 5; b++)
        if (g[r] & (16 >> b)) ctx.fillRect(x0 + (i * 6 + b) * px + ox, -y + r * px + oy, px, px);
    }
  };
  if (shadow) pass(px * 0.5, px * 0.5, shadow);
  pass(0, 0, color);
}

function sfx(name, vol = 1) {
  if (muted || !AUD[name]) return;
  const a = AUD[name].cloneNode();
  a.volume = vol;
  playing.add(a);
  a.onended = () => playing.delete(a);
  const p = a.play(); if (p && p.catch) p.catch(() => {});
}
function music(name, vol = 0.6) {
  if (musicEl) { musicEl.pause(); musicEl = null; }
  musicName = name;
  if (!name || muted) return;
  musicEl = AUD[name].cloneNode();
  musicEl.loop = true;                    // = his "forever: play sound until done"
  musicEl.volume = vol;
  const p = musicEl.play(); if (p && p.catch) p.catch(() => {});
}
function stopAllSounds() {               // = Scratch "stop all sounds"
  music(null);
  for (const a of playing) a.pause();
  playing.clear();
}
function toggleMute() {
  muted = !muted;
  if (muted) { const keep = musicName; stopAllSounds(); musicName = keep; }
  else if (musicName) music(musicName);
  try { localStorage.setItem("animol.muted", muted ? "1" : "0"); } catch (e) {}
}
try { muted = localStorage.getItem("animol.muted") === "1"; } catch (e) {}

// ---- saving (best times + which final forms you've found)
let save = { best: {}, found: [] };
try { const s = JSON.parse(localStorage.getItem("animol.save")); if (s && s.best && s.found) save = s; } catch (e) {}
function writeSave() { try { localStorage.setItem("animol.save", JSON.stringify(save)); } catch (e) {} }

// ---- input
const mouse = { x: 0, y: 0, down: false };
let isTouch = false;
function stagePoint(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.max(-240, Math.min(240, (e.clientX - r.left) / r.width * 480 - 240)),
    y: Math.max(-180, Math.min(180, 180 - (e.clientY - r.top) / r.height * 360)),
  };
}
function inEButton(p) { return isTouch && G.scene === "play" && Math.hypot(p.x - 200, p.y + 120) < 26; }
canvas.addEventListener("pointermove", e => {
  const p = stagePoint(e);
  if (e.pointerType === "touch" && inEButton(p)) return;
  mouse.x = p.x; mouse.y = p.y;
});
canvas.addEventListener("pointerdown", e => {
  if (e.pointerType === "touch") isTouch = true;
  const p = stagePoint(e);
  if (inEButton(p)) { pressE(); return; }
  mouse.x = p.x; mouse.y = p.y;
  click(p.x, p.y);
});
window.addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.code === "KeyE" || e.code === "Space") { pressE(); e.preventDefault(); }
  if (e.code === "KeyM") toggleMute();
});

// ---------------------------------------------------------------- 3. GAME
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));  // Scratch "pick random" with whole numbers
const G = {
  scene: "loading", t: 0,
  backdrop: "bakgrund1",
  spelartyp: "meat",                   // "meat" or "plant"
  utveclad: "normal meat",             // utveclad speltyp: which creature form you are
  level: 1,
  levelmätare: 0,                      // the level meter
  barShown: 0,                         // smoothed meter for the bar
  player: null, food: [], popups: [], critter: null,
  planets: [], starCostume: 3, starTimer: 1,
  levelUpT: 0, playTime: 0, endInfo: null, hintT: 0,
  hover: null,
};

// --- flag screen (the green flag: browsers only allow sound after a click)
function toFlag() { G.scene = "flag"; G.backdrop = "bakgrund1"; }

// --- main menu: his planets wobble around ANIMOL / PLAY
function planetScript(name, x, y, size, waits, steps) {
  return { name, x, y, homeX: x, size, waits, steps, phase: 0, timer: waits[0](), drawX: x };
}
function startMenu() {
  stopAllSounds();
  G.scene = "menu"; G.backdrop = "bakgrund1";
  G.planets = [
    // each: forever { wait A; move +steps; wait B; move -steps } (his exact waits)
    planetScript("sun",   -260, -163, 1000, [() => 2, () => 1],              5 * -1),
    planetScript("mars",  -166,  140,  700, [() => rand(1, 3), () => rand(1, 2)], 15),
    planetScript("moon",   131,  139,  600, [() => 1, () => 1],              -10),
    planetScript("earth",  188, -142, 1000, [() => rand(0, 3), () => rand(1, 3)], 10),
  ];
  G.starCostume = 3; G.starTimer = rand(1, 3);
  music("Space Ambience", 0.7);
}
function tickMenu() {
  for (const p of G.planets) {
    p.timer -= STEP;
    if (p.timer <= 0) {
      p.phase ^= 1;
      p.x = p.homeX + (p.phase ? p.steps : 0);
      p.timer = p.waits[p.phase]();
    }
    p.drawX += (p.x - p.drawX) * 0.18;     // glide instead of Scratch's jump
  }
  G.starTimer -= STEP;
  if (G.starTimer <= 0) { G.starCostume = (G.starCostume + 1) % 4; G.starTimer = rand(1, 3); }
}

// --- choose meat eater or plant eater (broadcast meddelande1)
function startChoose() {
  stopAllSounds();
  sfx("pop");
  G.scene = "choose"; G.backdrop = "Stars";
  music("Chill", 0.6);
}
const CHOOSERS = [
  { type: "meat",  sprite: "meat chooser",  x: -123, y: -15, label: "MEAT EATER" },
  { type: "plant", sprite: "plant chooser", x:  106, y: -15, label: "PLANT EATER" },
];

// --- playing a level
function startLevel(n) {
  stopAllSounds();
  G.scene = "play"; G.level = n;
  G.backdrop = n === 1 ? "bakgrund2" : "bakgrund4";
  G.levelmätare = 0; G.barShown = 0;
  const f = FORMS[G.utveclad];
  G.player = { x: 0, y: 0, dir: G.player && n === 2 ? G.player.dir : 90, costume: f.base,
               anim: null, animKind: null, moveDelay: n === 1 ? 2 : 0 };
  G.food = []; G.popups = [];
  G.spawnTimer = rand(1, 5);
  G.critter = { x: rand(-200, 200), y: rand(-120, 150), fx: 0, fy: 0, tx: 0, ty: 0, t: 0, dur: 3, costume: 0, ct: 0 };
  G.critter.fx = G.critter.tx = G.critter.x; G.critter.fy = G.critter.ty = G.critter.y;
  G.hintT = 5;
  if (n === 1) G.playTime = 0;
  music(n === 1 ? "Elec Piano Loop" : "Techno", 0.5);
}
function startAnim(kind) {
  const f = FORMS[G.utveclad], p = G.player;
  p.anim = { steps: f[kind], i: -1, t: 0 }; p.animKind = kind;
  nextAnimStep();
}
function nextAnimStep() {
  const p = G.player, a = p.anim;
  a.i++;
  if (a.i >= a.steps.length) { p.anim = null; p.animKind = null; p.costume = FORMS[G.utveclad].base; return; }
  const [c, secs, snd] = a.steps[a.i];
  p.costume = c; a.t = secs;
  if (snd) sfx(snd);
}
function pressE() {
  // like his "when e key pressed": does nothing if you are already mid-attack
  if (G.scene !== "play" || !G.player || G.player.animKind === "attack") return;
  startAnim("attack");
}
function spawnFood() {
  const sprite = G.spelartyp === "meat" ? "meat" : "plant";
  if (G.food.length >= 40) return;
  // his clones did "go to random position"; we keep them off the level bar and fully on screen
  G.food.push({ sprite, costume: rand(0, 2), x: rand(-215, 215), y: rand(-128, 160),
                size: sprite === "meat" ? 300 : 500, age: 0, dir: 90 });
}
function tickPlay() {
  const p = G.player, f = FORMS[G.utveclad];
  G.playTime += STEP;
  if (G.hintT > 0) G.hintT -= STEP;

  // animation player
  if (p.anim) { p.anim.t -= STEP; if (p.anim.t <= 0) nextAnimStep(); }

  // his movement: if distance to mouse > 40 { point towards mouse; move 5 steps }
  const dx = mouse.x - p.x, dy = mouse.y - p.y;
  if (Math.hypot(dx, dy) > 40) {
    p.dir = 90 - Math.atan2(dy, dx) * 180 / Math.PI;
    if (p.moveDelay <= 0) {
      const r = (p.dir) * Math.PI / 180;
      p.x += 5 * Math.sin(r); p.y += 5 * Math.cos(r);
      p.x = Math.max(-240, Math.min(240, p.x)); p.y = Math.max(-180, Math.min(180, p.y));
    }
  }
  if (p.moveDelay > 0) p.moveDelay -= STEP;

  // eating: touching food = it disappears and the meter goes up
  const pc = COST[f.sprite][f.base];
  const pr = costumeRadius(pc, 700);
  for (let i = G.food.length - 1; i >= 0; i--) {
    const fd = G.food[i], c = COST[fd.sprite][fd.costume];
    const s = fd.size / 100 / 2;
    const fx = fd.x + (c.img.width / 2 - c.cx) * s, fy = fd.y - (c.img.height / 2 - c.cy) * s;
    if (Math.hypot(fx - p.x, fy - p.y) < pr + costumeRadius(c, fd.size)) {
      G.food.splice(i, 1);
      G.levelmätare += f.gain;
      G.popups.push({ x: fx, y: fy, text: "+" + f.gain, t: 0.8 });
      startAnim("eat");
    }
  }
  for (const fd of G.food) fd.age += STEP;

  // food spawner: forever { wait (1 to 5) secs; create clone }
  G.spawnTimer -= STEP;
  if (G.spawnTimer <= 0) { spawnFood(); G.spawnTimer = rand(1, 5); }

  for (const pp of G.popups) { pp.t -= STEP; pp.y += 0.8; }
  G.popups = G.popups.filter(pp => pp.t > 0);

  // the little swimmer (his Sprajt5): glide 3 secs to random position, forever
  const cr = G.critter;
  cr.t += STEP;
  if (cr.t >= cr.dur) { cr.fx = cr.x; cr.fy = cr.y; cr.tx = rand(-220, 220); cr.ty = rand(-130, 165); cr.t = 0; }
  const k = Math.min(1, cr.t / cr.dur);
  cr.x = cr.fx + (cr.tx - cr.fx) * k; cr.y = cr.fy + (cr.ty - cr.fy) * k;
  cr.ct += STEP; if (cr.ct > 0.3) { cr.ct = 0; cr.costume ^= 1; }

  G.barShown += (Math.min(G.levelmätare, GOAL[G.level]) - G.barShown) * 0.2;

  if (G.level === 1 && G.levelmätare > 49) levelUp();
  else if (G.level === 2 && G.levelmätare > 64) finish();
}

// --- LEVEL UP! (broadcast "level uuuuuuuuuuuuuup 1")
function levelUp() {
  stopAllSounds();
  G.scene = "levelup"; G.backdrop = "Stars2"; G.levelUpT = 0;
  G.food = []; G.popups = [];
  sfx("Triumph");
}
function tickLevelUp() { G.levelUpT += STEP; }
function pickUpgrade(u) {
  sfx("pop");
  G.utveclad = u.form;
  startLevel(2);
}

// --- the end (new: his level 2 never ended, so evolving fully is the win)
function finish() {
  stopAllSounds();
  sfx("Win");
  const time = G.playTime;
  const prevBest = save.best[G.utveclad];
  const newForm = !save.found.includes(G.utveclad);
  if (newForm) save.found.push(G.utveclad);
  if (prevBest === undefined || time < prevBest) save.best[G.utveclad] = time;
  writeSave();
  G.endInfo = { time, best: save.best[G.utveclad], record: prevBest === undefined || time < prevBest, newForm, t: 0 };
  G.scene = "end"; G.backdrop = "Stars";
  G.player.costume = FORMS[G.utveclad].base; G.player.anim = null; G.player.animKind = null;
}
function tickEnd() {
  G.endInfo.t += STEP;
  const p = G.player;
  if (p.anim) { p.anim.t -= STEP; if (p.anim.t <= 0) nextAnimStep(); }
  else if (G.endInfo.t % 2.5 < STEP) startAnim("attack");   // show off the attack every few seconds
}
const fmtTime = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

// --- clicking
function hit(c, x, y, size, px, py) {
  const b = costumeBox(c, x, y, size);
  return px >= b.left - 6 && px <= b.right + 6 && py <= b.top + 6 && py >= b.bottom - 6;
}
function hoverTarget(px, py) {
  if (G.scene === "menu" && hit(COST.play[0], 9, -67, 200, px, py)) return "play";
  if (G.scene === "choose") for (const ch of CHOOSERS) if (hit(COST[ch.sprite][0], ch.x, ch.y, 700, px, py)) return ch;
  if (G.scene === "levelup" && G.levelUpT >= 5)
    for (const u of UPGRADES[G.spelartyp]) if (hit(COST[u.sprite][0], u.x, 0, 700, px, py)) return u;
  return null;
}
function click(px, py) {
  if (G.scene === "flag") { startMenu(); return; }
  if (G.scene === "end") { if (G.endInfo.t > 1.5) startMenu(); return; }
  const h = hoverTarget(px, py);
  if (!h) return;
  if (h === "play") startChoose();
  else if (G.scene === "choose") {
    G.spelartyp = h.type;
    G.utveclad = h.type === "meat" ? "normal meat" : "normal plant";
    G.player = null;
    startLevel(1);
  } else if (G.scene === "levelup") pickUpgrade(h);
}

function tick() {
  G.t += STEP;
  G.hover = hoverTarget(mouse.x, mouse.y);
  canvas.style.cursor = G.hover || G.scene === "flag" || (G.scene === "end" && G.endInfo.t > 1.5) ? "pointer" : "default";
  if (G.scene === "menu") tickMenu();
  else if (G.scene === "play") tickPlay();
  else if (G.scene === "levelup") tickLevelUp();
  else if (G.scene === "end") tickEnd();
}

// ---------------------------------------------------------------- 4. DRAW
function bob(target, amount = 0.06) {      // little hover pulse for clickable things
  return G.hover === target ? 1 + amount + Math.sin(G.t * 8) * 0.02 : 1;
}
function draw() {
  ctx.setTransform(viewScale, 0, 0, viewScale, canvas.width / 2, canvas.height / 2);
  ctx.imageSmoothingEnabled = true;          // the starry photo backdrop looks best smooth
  ctx.fillStyle = "#000"; ctx.fillRect(-240, -180, 480, 360);
  const bg = BACK[G.backdrop];
  if (bg && bg.width) ctx.drawImage(bg, -240, -180, 480, 360);
  ctx.imageSmoothingEnabled = false;         // ...but his pixel art stays crisp

  if (G.scene === "loading") {
    pixelText("LOADING " + Math.floor(loaded / toLoad * 100) + "%", 0, 4, 2, "#fff");
  } else if (G.scene === "flag") drawFlag();
  else if (G.scene === "menu") drawMenu();
  else if (G.scene === "choose") drawChoose();
  else if (G.scene === "play") drawPlay();
  else if (G.scene === "levelup") drawLevelUp();
  else if (G.scene === "end") drawEnd();

  if (muted && G.scene !== "loading") pixelText("MUTED", 234, 176, 1, "#fff", 1);
}
function drawFlag() {
  drawCostume(COST.sign[0], 11, 45, 400);
  // a green flag, Scratch style
  ctx.fillStyle = "#c58a2a"; ctx.fillRect(-22, 10, 4, 44);
  ctx.fillStyle = "#4cbf56";
  const w = Math.sin(G.t * 4) * 2;
  ctx.beginPath(); ctx.moveTo(-18, 10); ctx.quadraticCurveTo(0, 4 + w, 20, 12); ctx.lineTo(20, 34);
  ctx.quadraticCurveTo(0, 26 + w, -18, 32); ctx.closePath(); ctx.fill();
  pixelText("CLICK TO START", 0, -62, 2, "#fff");
  pixelText("M = MUTE", 0, -150, 1, "rgba(255,255,255,.6)");
}
function drawMenu() {
  drawCostume(COST.stars[G.starCostume], 89, 78, 600);
  for (const p of G.planets) drawCostume(COST[p.name][0], p.drawX, p.y, p.size);
  drawCostume(COST.sign[0], 11, 15 + Math.sin(G.t * 1.5) * 2, 400);
  drawCostume(COST.play[0], 9, -67, 200 * bob("play"));
  if (save.found.length)
    pixelText("FORMS FOUND " + save.found.length + "/" + FINAL_FORMS.length, 0, -110, 1, "rgba(255,255,255,.75)");
}
function drawChoose() {
  pixelText("CHOOSE YOUR ANIMOL", 0, 120, 3, "#fff", 0.5, BLUE);
  for (const ch of CHOOSERS) {
    const sc = bob(ch, 0.12);
    drawCostume(COST[ch.sprite][0], ch.x, ch.y + Math.sin(G.t * 2 + ch.x) * 3, 700 * sc);
    pixelText(ch.label, ch.x, -70, 2, G.hover === ch ? "#fff" : "#9fb4ff", 0.5, BLUE);
  }
}
function drawPlay() {
  const p = G.player, f = FORMS[G.utveclad];
  // swimmer
  const cr = G.critter;
  drawCostume(COST.Sprajt5[cr.costume], cr.x, cr.y, 500, 90, 0.85);
  // food (pops in when it spawns)
  for (const fd of G.food) {
    const k = Math.min(1, fd.age / 0.25);
    const pop = k < 1 ? k * (1.25 - 0.25 * k) : 1;
    drawCostume(COST[fd.sprite][fd.costume], fd.x, fd.y + Math.sin(G.t * 2 + fd.x) * 1.5, fd.size * pop);
  }
  drawCostume(COST[f.sprite][p.costume], p.x, p.y, 700, p.dir);
  for (const pp of G.popups) {
    ctx.globalAlpha = Math.min(1, pp.t / 0.3);
    pixelText(pp.text, pp.x, pp.y + 10, 2, "#fff", 0.5, BLUE);
    ctx.globalAlpha = 1;
  }
  // his level meter: frame (Sprajt3) and cyan bar (Sprajt1) sliding in from the left
  const goal = GOAL[G.level];
  drawCostume(COST.Sprajt3[0], -5, -163, 100);
  ctx.save();
  ctx.beginPath(); ctx.rect(-242, 163 - 15, 408, 30); ctx.clip();
  drawCostume(COST.Sprajt1[0], -400 + G.barShown * (400 / goal), -163, 100);
  ctx.restore();
  pixelText("LEVEL " + G.level, -236, -138, 2, "#fff", 0, BLUE);
  pixelText(Math.min(G.levelmätare, goal) + "/" + goal, 236, -138, 2, "#fff", 1, BLUE);
  if (G.hintT > 0) {
    ctx.globalAlpha = Math.min(1, G.hintT);
    const verb = f.attackName;
    pixelText(G.level === 1 ? "SWIM WITH THE MOUSE" : f.label, 0, 150, 2, "#fff", 0.5, BLUE);
    pixelText("EAT " + (G.spelartyp === "meat" ? "MEAT" : "PLANTS") + "  -  E = " + verb, 0, 128, 2, "#fff", 0.5, BLUE);
    ctx.globalAlpha = 1;
  }
  if (isTouch) {
    ctx.fillStyle = "rgba(255,255,255,.25)";
    ctx.beginPath(); ctx.arc(200, -120, 24, 0, Math.PI * 2); ctx.fill();
    pixelText("E", 200, -109, 3, "#fff");
  }
}
function drawLevelUp() {
  const t = G.levelUpT;
  if (t < 5) {
    const k = Math.min(1, t / 0.35);
    const sc = k < 1 ? 0.3 + k * 0.85 : 1.15 - Math.min(0.15, (t - 0.35) * 0.6);
    drawCostume(COST.Sprajt4[0], 0, Math.sin(t * 3) * 4, 100 * sc);
  } else {
    pixelText("EVOLVE!", 0, 120, 4, "#fff", 0.5, BLUE);
    const appear = Math.min(1, (t - 5) / 0.3);
    const names = { attack: "ATTACK", eat: "EAT", defence: "DEFENCE" };
    for (const u of UPGRADES[G.spelartyp]) {
      drawCostume(COST[u.sprite][0], u.x, Math.sin(G.t * 2 + u.x) * 3, 700 * appear * bob(u, 0.12));
      pixelText(names[u.kind], u.x, -62, 2, G.hover === u ? "#fff" : "#9fb4ff", 0.5, BLUE);
      if (u.kind === "eat") pixelText("2 X FOOD", u.x, -82, 1, "#ffe066", 0.5, null);
    }
  }
}
function drawEnd() {
  const e = G.endInfo, f = FORMS[G.utveclad];
  pixelText("FULLY EVOLVED!", 0, 150, 4, "#fff", 0.5, BLUE);
  pixelText(f.label, 0, 112, 2, "#9fb4ff", 0.5, BLUE);
  drawCostume(COST[f.sprite][G.player.costume], 0, 10 + Math.sin(G.t * 2) * 4, 1000);
  pixelText("TIME " + fmtTime(e.time) + "   BEST " + fmtTime(e.best), 0, -78, 2, "#fff", 0.5, BLUE);
  if (e.record) pixelText(e.newForm ? "NEW FORM FOUND!" : "NEW RECORD!", 0, -100, 2, "#ffe066", 0.5, BLUE);
  pixelText("FORMS FOUND " + save.found.length + "/" + FINAL_FORMS.length, 0, -122, 1, "rgba(255,255,255,.8)");
  if (e.t > 1.5) pixelText("CLICK TO PLAY AGAIN", 0, -145, 2, Math.sin(G.t * 5) > 0 ? "#fff" : "#9fb4ff", 0.5, BLUE);
}

// ---------------------------------------------------------------- main loop
let last = 0, acc = 0;
function frame(now) {
  if (G.scene === "loading" && loaded >= toLoad) toFlag();
  acc += Math.min(0.25, (now - last) / 1000 || 0);
  last = now;
  while (acc >= STEP) { tick(); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
if (!window.__ANIMOL_TEST) requestAnimationFrame(t => { last = t; frame(t); });
</script>
