// ----------------------------------------------------------- screen + camera
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let BW = 0, BH = 0, DPR = 1;             // backing-store size in device pixels
let ZOOM = 1;                            // device pixels per world unit
let UI = 1, VW = 1280, VH = 720;         // UI scale and the virtual UI size
const cam = { x: 0, y: 0, shake: 0 };

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
  BW = canvas.width = Math.max(1, Math.round(w * DPR));
  BH = canvas.height = Math.max(1, Math.round(h * DPR));
  ZOOM = Math.min(BW / 1050, BH / 650);  // you always see about 1050 x 650 of the world
  UI = Math.min(BW / 1280, BH / 720);
  VW = BW / UI; VH = BH / UI;
}
window.addEventListener("resize", resize);
resize();

function worldToScreen(x, y) { return { x: (x - cam.x) * ZOOM + BW / 2, y: (y - cam.y) * ZOOM + BH / 2 }; }
function screenToWorld(sx, sy) { return { x: (sx - BW / 2) / ZOOM + cam.x, y: (sy - BH / 2) / ZOOM + cam.y }; }
function setWorldTransform() {
  const sx = cam.shake > 0 ? (Math.random() - 0.5) * cam.shake * 14 : 0, sy = cam.shake > 0 ? (Math.random() - 0.5) * cam.shake * 14 : 0;
  ctx.setTransform(ZOOM, 0, 0, ZOOM, BW / 2 - cam.x * ZOOM + sx * DPR, BH / 2 - cam.y * ZOOM + sy * DPR);
}
function setUITransform() { ctx.setTransform(UI, 0, 0, UI, 0, 0); }

// ----------------------------------------------------------- input
const mouse = { sx: BW / 2, sy: BH / 2, ux: 0, uy: 0, moved: false };
let isTouch = false;
const keys = {};
function setMouseFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  mouse.sx = (e.clientX - r.left) * DPR; mouse.sy = (e.clientY - r.top) * DPR;
  mouse.ux = mouse.sx / UI; mouse.uy = mouse.sy / UI;
  mouse.moved = true;
}
canvas.addEventListener("pointermove", e => {
  if (e.pointerType === "touch") { isTouch = true; if (touchOnButton(e)) return; }
  setMouseFromEvent(e);
});
canvas.addEventListener("pointerdown", e => {
  initSynth();
  if (e.pointerType === "touch") isTouch = true;
  if (e.pointerType === "touch" && touchOnButton(e)) { onAttackButton(); return; }
  setMouseFromEvent(e);
  onClick(mouse.ux, mouse.uy, e.pointerType, e.button);
});
canvas.addEventListener("contextmenu", e => e.preventDefault());
window.addEventListener("keydown", e => {
  initSynth();
  if (e.repeat) return;
  keys[e.code] = true;
  onKey(e.code);
  if (e.code === "Space") e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
window.addEventListener("blur", () => { if (typeof autoPause === "function") autoPause(); });

// ----------------------------------------------------------- saving
let save = { best: {}, found: [], vol: 0.8, muted: false, wins: 0, ach: [], totals: { eaten: 0, kills: 0, alphas: 0 }, hardFound: [], hard: false, dna: 0, shop: {} };
try {
  const s = JSON.parse(localStorage.getItem("animol.v2"));
  if (s && typeof s === "object" && !Array.isArray(s)) save = Object.assign(save, s);
  // older saves (from before achievements / the shop) just get the new empty fields
  save.totals = Object.assign({ eaten: 0, kills: 0, alphas: 0 }, save.totals && typeof save.totals === "object" ? save.totals : {});
  for (const k of ["eaten", "kills", "alphas"]) save.totals[k] = Math.max(0, Math.floor(+save.totals[k] || 0));
  save.wins = Math.max(0, Math.floor(+save.wins || 0));
  for (const k of ["ach", "found", "hardFound"]) if (!Array.isArray(save[k])) save[k] = [];
  if (!save.shop || typeof save.shop !== "object" || Array.isArray(save.shop)) save.shop = {};
  if (!save.best || typeof save.best !== "object") save.best = {};
  save.dna = Math.max(0, Math.floor(+save.dna || 0));
  save.vol = Number.isFinite(+save.vol) ? Math.min(1, Math.max(0, +save.vol)) : 0.8;
  save.muted = !!save.muted; save.hard = !!save.hard;
} catch (e) {}
function writeSave() { try { localStorage.setItem("animol.v2", JSON.stringify(save)); } catch (e) {} }
const volume = () => (save.muted ? 0 : save.vol);

// ----------------------------------------------------------- his sounds (<audio> works even from file://)
const AUD = {};
for (const n in SOUNDS) { const a = new Audio("assets/" + SOUNDS[n] + ".wav"); a.preload = "auto"; AUD[n] = a; }
let musicEl = null, musicName = null, musicBase = 0.5;
const playingSfx = new Set();
function sfx(name, vol = 1) {
  if (!AUD[name] || volume() <= 0) return;
  const a = AUD[name].cloneNode();
  a.volume = Math.min(1, vol * volume());
  playingSfx.add(a); a.onended = () => playingSfx.delete(a);
  const p = a.play(); if (p && p.catch) p.catch(() => {});
}
function music(name, base = 0.5) {
  if (musicName === name && musicEl) return;
  if (musicEl) musicEl.pause();
  musicEl = null; musicName = name; musicBase = base;
  if (!name) return;
  musicEl = AUD[name].cloneNode();
  musicEl.loop = true;                   // like his "forever: play sound until done"
  musicEl.volume = Math.min(1, base * volume());
  const p = musicEl.play(); if (p && p.catch) p.catch(() => {});
}
function stopAllSounds() { music(null); for (const a of playingSfx) a.pause(); playingSfx.clear(); }
function applyVolume() {
  if (musicEl) musicEl.volume = Math.min(1, musicBase * volume());
  if (synth.master) synth.master.gain.value = volume() * 0.9;
  writeSave();
}

// ----------------------------------------------------------- new synthesized sounds (WebAudio)
// An oscillator is a tone generator; a gain node is a volume knob. Each sound
// is a few of them wired together with a quick volume "envelope" (fade in/out).
const synth = { ctx: null, master: null, noise: null, amb: null, ambKind: null };
function initSynth() {
  if (synth.ctx) { if (synth.ctx.state === "suspended") synth.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    synth.ctx = new AC();
    synth.master = synth.ctx.createGain();
    synth.master.gain.value = volume() * 0.9;
    synth.master.connect(synth.ctx.destination);
    const len = synth.ctx.sampleRate * 2;
    synth.noise = synth.ctx.createBuffer(1, len, synth.ctx.sampleRate);
    const d = synth.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    if (synth.wantAmb) ambience(synth.wantAmb);
  } catch (e) { synth.ctx = null; }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const A = synth.ctx; if (!A || volume() <= 0) return;
  const t = A.currentTime + delay, o = A.createOscillator(), g = A.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(synth.master); o.start(t); o.stop(t + dur + 0.05);
}
function noiseHit(dur, vol, type, f0, f1, delay = 0) {
  const A = synth.ctx; if (!A || volume() <= 0) return;
  const t = A.currentTime + delay, s = A.createBufferSource(), f = A.createBiquadFilter(), g = A.createGain();
  s.buffer = synth.noise; f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(synth.master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
const SYN = {
  bubble(v = 0.08) { const f = 300 + Math.random() * 300; tone("sine", f, f * 3, 0.08, v); },
  hover() { tone("triangle", 880, 990, 0.05, 0.05); },
  click() { tone("square", 520, 520, 0.05, 0.05); tone("square", 780, 780, 0.08, 0.05, 0.05); },
  hurt() { tone("sawtooth", 260, 70, 0.28, 0.16); noiseHit(0.2, 0.25, "lowpass", 2500, 300); },
  hit() { noiseHit(0.09, 0.3, "lowpass", 4000, 500); tone("triangle", 180, 50, 0.14, 0.3); },
  kill() { [700, 560, 420, 300].forEach((f, i) => tone("square", f, f * 0.85, 0.08, 0.05, i * 0.05)); noiseHit(0.25, 0.15, "bandpass", 1500, 300); },
  sparkle() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone("sine", f, f, 0.35, 0.06, i * 0.07)); },
  warn() { tone("square", 1300, 900, 0.16, 0.035); tone("square", 1250, 850, 0.16, 0.035, 0.2); },
  roar() { tone("sawtooth", 95, 32, 1.1, 0.25); tone("square", 60, 30, 1.0, 0.12); noiseHit(1.0, 0.25, "lowpass", 900, 120); },
  die() { tone("triangle", 500, 60, 0.9, 0.2); noiseHit(0.5, 0.15, "lowpass", 1200, 100); },
  heal() { tone("sine", 660, 990, 0.12, 0.04); },
  step() { noiseHit(0.05, 0.05, "bandpass", 900, 600); },
  swoosh() { noiseHit(0.25, 0.12, "bandpass", 600, 2400); },
};
// looping background ambience: filtered noise = water rumble / wind
function ambience(kind) {
  synth.wantAmb = kind;
  const A = synth.ctx; if (!A || synth.ambKind === kind) return;
  if (synth.amb) { const old = synth.amb; old.g.gain.setTargetAtTime(0, A.currentTime, 0.4); setTimeout(() => { try { old.s.stop(); old.lfo.stop(); } catch (e) {} }, 1500); synth.amb = null; }
  synth.ambKind = kind;
  if (!kind) return;
  const s = A.createBufferSource(), f = A.createBiquadFilter(), g = A.createGain(), lfo = A.createOscillator(), lg = A.createGain();
  s.buffer = synth.noise; s.loop = true;
  const cfg = { sea: ["lowpass", 520, 0.06], open: ["lowpass", 380, 0.07], deep: ["lowpass", 200, 0.11], land: ["bandpass", 650, 0.05], space: ["lowpass", 260, 0.03], moon: ["lowpass", 170, 0.05], mars: ["bandpass", 480, 0.07] }[kind];
  f.type = cfg[0]; f.frequency.value = cfg[1]; f.Q.value = 0.7;
  lfo.frequency.value = kind === "land" ? 0.13 : 0.2; lg.gain.value = cfg[1] * 0.35;
  lfo.connect(lg); lg.connect(f.frequency);
  g.gain.value = 0; g.gain.setTargetAtTime(cfg[2], A.currentTime, 0.8);
  s.connect(f); f.connect(g); g.connect(synth.master);
  s.start(); lfo.start();
  synth.amb = { s, g, lfo };
}

// ----------------------------------------------------------- small helpers
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const easeOutBack = k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);
function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
const fmtTime = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

// =====================================================================
// PART 2 - ART. Everything is drawn with canvas paths: fill + gradient
// shading + dark outline. Creatures face RIGHT (+x) in their own space.
// =====================================================================
const COL = {
  body: ["#a8ffbf", "#22d455", "#08852c"], line: "#06361a",
  brown: "#8e5a1a", brownHi: "#c99245", brownLine: "#3a2208",
  eye: "#0a0a12", bone: "#f4f6ff", boneLine: "#7d8699",
};

function strokeFill(g, fill, line, lw) {
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (line) { g.lineWidth = lw || 2.5; g.strokeStyle = line; g.stroke(); }
}
function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0.01, r), 0, Math.PI * 2); }
function radial(g, x, y, r, stops, lx = -0.35, ly = -0.4) {
  const gr = g.createRadialGradient(x + lx * r, y + ly * r, r * 0.08, x, y, r * 1.05);
  stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c));
  return gr;
}
function polyline(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); }
function roundRect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function shadow(g, x, y, rx, ry, a = 0.22) {
  g.save(); g.fillStyle = `rgba(0,10,30,${a})`; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); g.restore();
}

// ---------------------------------------------------------------- THE CREATURE (his design)
// look = { type: "meat"|"plant", stats: {atk, eat, def}, evolved, legs, t, open, angry, swing, swingTrail,
//          punch, spikeOut, curl, flash, walk, moving, blink }
// His features, now driven by your stats:
//   tail ............ every evolved form (all his "upg 2" costumes have one)
//   ATTACK 1+ ....... his two brown knobs with white whiskers; 2+ bone spikes; 3 war paint + red eyes
//   EAT 1+ .......... meat: his big box jaws, plant: his three vines; 2+ glowing feelers; 3 bigger body
//   DEFENCE 1+ ...... his white spikes all around; 2+ armour plates; 3 longer spikes
function drawCreatureV1(g, x, y, ang, k, L) {
  const R = 24, st = L.stats, plant = L.type === "plant";
  const S = k * (st.eat >= 3 ? 1.12 : 1);
  g.save();
  g.translate(x, y); g.rotate(ang); g.scale(S, S);
  g.lineJoin = "round"; g.lineCap = "round";
  if (L.legs) drawLegs(g, R, L);
  if (L.evolved) drawTail(g, R, L);
  if (plant) drawVines(g, R, L);
  if (st.def >= 1) drawSpikes(g, R, L);
  drawBody(g, R, ang, L);
  if (st.def >= 2) drawPlates(g, R);
  if (st.atk >= 1) drawKnobs(g, R, L);
  if (st.atk >= 3) drawWarPaint(g, R);
  drawEyes(g, R, L);
  if (!plant) { if (st.eat >= 1) drawJaws(g, R, L); else drawClaws(g, R, L); }
  if (st.eat >= 2) drawFeelers(g, R, L);
  if (L.flash > 0) { circle(g, 0, 0, R + 1); g.fillStyle = `rgba(255,255,255,${L.flash * 0.75})`; g.fill(); }
  g.restore();
}
function drawBody(g, R, ang, L) {
  // light comes from the top-left of the WORLD, so turn it against the creature's rotation
  const lx = Math.cos(-ang) * -0.35 - Math.sin(-ang) * -0.42, ly = Math.sin(-ang) * -0.35 + Math.cos(-ang) * -0.42;
  const squash = 1 + Math.sin(L.t * 9) * 0.025 * (L.moving || 0);
  g.save(); g.scale(squash, 1 / squash);
  circle(g, 0, 0, R);

// ---------------------------------------------------------------- PLANETS (his menu: earth, mars, moon, sun)
const earthLand = (() => { const r = seeded(11); return Array.from({ length: 9 }, () => ({ x: r(), y: r() * 1.6 - 0.8, w: 0.15 + r() * 0.25, h: 0.12 + r() * 0.22, c: r() < 0.25 ? "w" : "g" })); })();
const craters = (seed, n) => { const r = seeded(seed); return Array.from({ length: n }, () => ({ x: r() * 1.4 - 0.7, y: r() * 1.4 - 0.7, r: 0.08 + r() * 0.2 })); };

function planetShade(g, x, y, r) {          // night side shadow + rim light
  const gr = g.createRadialGradient(x - r * 0.45, y - r * 0.45, r * 0.2, x, y, r * 1.1);
  gr.addColorStop(0, "rgba(255,255,255,.18)"); gr.addColorStop(0.55, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,20,.65)");
  circle(g, x, y, r); g.fillStyle = gr; g.fill();
}
function drawCratered(g, x, y, r, cols, cr, t) {
  g.save();
  circle(g, x, y, r); g.fillStyle = radial(g, x, y, r, cols); g.fill();
  g.clip();
  for (const c of cr) {
    const cx = x + c.x * r, cy = y + c.y * r, rr = c.r * r;
    circle(g, cx, cy, rr); g.fillStyle = "rgba(0,0,0,.22)"; g.fill();
    g.beginPath(); g.arc(cx, cy, rr, 0.2, Math.PI + 0.2); g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = r * 0.03; g.stroke();
  }

  g.restore();
}
function drawEarth(g, x, y, r, t) {
  g.save();
  circle(g, x, y, r * 1.18); g.fillStyle = radial(g, x, y, r * 1.18, ["rgba(90,170,255,.0)", "rgba(90,170,255,.0)", "rgba(90,170,255,.35)", "rgba(90,170,255,0)"], 0, 0); g.fill();
  circle(g, x, y, r); g.fillStyle = radial(g, x, y, r, ["#4f8dff", "#1d4fe0", "#0a2678"]); g.fill();
  g.clip();
  const spin = (t * 0.03) % 1;
  for (const L of earthLand) for (const o of [0, -1]) {
    const lx = x + ((L.x + spin + o) * 2.2 - 0.6) * r, ly = y + L.y * r;
    g.beginPath(); g.ellipse(lx, ly, L.w * r, L.h * r, L.x * 3, 0, Math.PI * 2);
    g.fillStyle = L.c === "w" ? "rgba(255,255,255,.95)" : "#25c04a"; g.fill();
    if (L.c === "g") { g.beginPath(); g.ellipse(lx + L.w * r * 0.2, ly - L.h * r * 0.2, L.w * r * 0.5, L.h * r * 0.4, 0, 0, Math.PI * 2); g.fillStyle = "#4fdc6c"; g.fill(); }
  }
  g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = r * 0.07;
  for (let i = 0; i < 3; i++) { const cy = y - r * 0.5 + i * r * 0.45, off = ((t * 0.05 + i * 0.3) % 1) * r * 2.4 - r * 1.2;
    g.beginPath(); g.moveTo(x + off - r * 0.5, cy); g.quadraticCurveTo(x + off, cy - r * 0.15, x + off + r * 0.6, cy + r * 0.05); g.stroke(); }

  g.restore();
}
function drawSun(g, x, y, r, t) {
  g.save();
  circle(g, x, y, r * 2.2); g.fillStyle = radial(g, x, y, r * 2.2, ["rgba(255,210,60,.45)", "rgba(255,150,20,.12)", "rgba(255,120,0,0)"], 0, 0); g.fill();
  g.beginPath();

    const a = i / 48 * Math.PI * 2, rr = r * (1.08 + 0.07 * Math.sin(a * 7 + t * 3) + 0.05 * Math.sin(a * 13 - t * 5));
    i ? g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath(); g.fillStyle = "#ffe23a"; g.fill();
  circle(g, x, y, r); g.fillStyle = radial(g, x, y, r, ["#fff3a0", "#ffb31a", "#ff8a00"], -0.2, -0.2); g.fill();

}
const drawMars = (g, x, y, r, t) => drawCratered(g, x, y, r, ["#ffab6b", "#e0661f", "#8c3208"], marsCraters, t);
const drawMoon = (g, x, y, r, t) => drawCratered(g, x, y, r, ["#f2f2f2", "#a9adb5", "#5b5f68"], moonCraters, t);

// ---------------------------------------------------------------- SPACE BACKGROUND (menu + ending)
const spaceStars = (() => { const r = seeded(99); return Array.from({ length: 260 }, () => ({ x: r(), y: r(), s: 0.4 + r() * 1.6, p: r() * 6, d: 0.2 + r() * 0.8 })); })();
let shooting = null;
function drawSpace(g, t, px = 0, py = 0) {
  const w = VW, h = VH;
  const bg = g.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, "#05031a"); bg.addColorStop(1, "#0b1236");
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.save(); g.globalCompositeOperation = "lighter";
  for (const [nx, ny, nr, c] of [[0.25, 0.3, 0.45, "rgba(120,40,200,.18)"], [0.8, 0.65, 0.5, "rgba(30,90,220,.16)"], [0.55, 0.15, 0.3, "rgba(220,60,160,.10)"]]) {
    const cx = (nx + Math.sin(t * 0.03 + nx * 9) * 0.02) * w - px * 10, cy = ny * h - py * 10;
    circle(g, cx, cy, nr * w); g.fillStyle = radial(g, cx, cy, nr * w, [c, "rgba(0,0,0,0)"], 0, 0); g.fill();
  }
  for (const s of spaceStars) {
    const tw = 0.55 + 0.45 * Math.sin(t * (1 + s.d * 2) + s.p);
    g.globalAlpha = tw * s.d; g.fillStyle = "#fff";
    const x = ((s.x * w - px * 30 * s.d) % w + w) % w, y = ((s.y * h - py * 30 * s.d) % h + h) % h;
    g.fillRect(x, y, s.s, s.s);
    if (s.s > 1.7 && tw > 0.9) { g.fillRect(x - 3, y + s.s / 2 - 0.4, 6 + s.s, 0.8); g.fillRect(x + s.s / 2 - 0.4, y - 3, 0.8, 6 + s.s); }
  }
  g.globalAlpha = 1;
  if (!shooting && Math.random() < 0.004) shooting = { x: rnd(0.2, 1) * w, y: rnd(0, 0.4) * h, t: 0 };
  if (shooting) {
    shooting.t += 1 / 60; const k = shooting.t / 0.8, x = shooting.x - k * 420, y = shooting.y + k * 200;
    const gr = g.createLinearGradient(x, y, x + 120, y - 57); gr.addColorStop(0, "rgba(255,255,255,.9)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.strokeStyle = gr; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 120, y - 57); g.stroke();
    if (k >= 1) shooting = null;
  }
  g.restore();
}

// ---------------------------------------------------------------- WORLDS (sea floor, deep, shore)
// The floor of each zone is painted once into an off-screen canvas (fast), then
// moving things (light, kelp, bubbles, waves) are drawn on top every frame.
const FLOOR_RES = 0.5;
function buildFloorBase(z) {
  const Z = ZONES[z], r = seeded(z * 977 + 3);
  const c = makeCanvas(Z.w * FLOOR_RES, Z.h * FLOOR_RES), g = c.getContext("2d");
  g.scale(FLOOR_RES, FLOOR_RES);
  const pal = {
    sea:  { a: "#1aa5e8", b: "#0b78c2", sand: "rgba(255,240,190,.10)", rock: ["#4f7fa6", "#2c5878", "#163650"], weed: "#1f9e57" },
    open: { a: "#1271c4", b: "#0a4c94", sand: "rgba(220,240,255,.06)", rock: ["#3b6390", "#22426a", "#10233d"], weed: "#18805a" },
    deep: { a: "#0b1e4a", b: "#050b22", sand: "rgba(120,160,255,.04)", rock: ["#26355e", "#151f3d", "#080d1f"], weed: "#204a6a" },
    land: { a: "#f0d595", b: "#d9b366", sand: "rgba(120,80,20,.08)", rock: ["#b9b2a6", "#86806f", "#4f4a3e"], weed: "#4cae3a" },
  }[Z.kind];
  const bg = g.createLinearGradient(0, 0, Z.w * 0.3, Z.h); bg.addColorStop(0, pal.a); bg.addColorStop(1, pal.b);
  g.fillStyle = bg; g.fillRect(0, 0, Z.w, Z.h);
  // soft blotches
  for (let i = 0; i < 60; i++) { const x = r() * Z.w, y = r() * Z.h, rr = 60 + r() * 200;
    circle(g, x, y, rr); g.fillStyle = radial(g, x, y, rr, [r() < 0.5 ? "rgba(255,255,255,.06)" : "rgba(0,0,30,.08)", "rgba(0,0,0,0)"], 0, 0); g.fill(); }
  // sand ripples
  g.strokeStyle = pal.sand; g.lineWidth = 3;
  for (let i = 0; i < 140; i++) { const x = r() * Z.w, y = r() * Z.h, L = 30 + r() * 80;
    g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + L * 0.3, y - 6, x + L * 0.7, y + 6, x + L, y); g.stroke(); }
  // pebbles
  for (let i = 0; i < 160; i++) { const x = r() * Z.w, y = r() * Z.h, rr = 2 + r() * 5;
    g.beginPath(); g.ellipse(x, y, rr * 1.3, rr, r() * 3, 0, Math.PI * 2); g.fillStyle = pal.rock[irnd(0, 1)]; g.globalAlpha = 0.6; g.fill(); g.globalAlpha = 1; }
  // rocks (top-down blobs with shading)
  const rocks = [];
  const addRock = (x, y, rr) => {
    rocks.push({ x, y, r: rr });
    g.save(); g.translate(x, y);
    shadow(g, 8, 10, rr * 1.05, rr * 0.85, Z.kind === "land" ? 0.25 : 0.3);
    g.beginPath();
    for (let i = 0; i <= 9; i++) { const a = i / 9 * Math.PI * 2, q = rr * (0.8 + r() * 0.25); i ? g.lineTo(Math.cos(a) * q, Math.sin(a) * q) : g.moveTo(Math.cos(a) * q, Math.sin(a) * q); }
    g.closePath(); strokeFill(g, radial(g, 0, 0, rr, pal.rock), "rgba(0,0,0,.35)", 3);
    g.beginPath(); g.ellipse(-rr * 0.3, -rr * 0.35, rr * 0.3, rr * 0.15, -0.5, 0, Math.PI * 2); g.fillStyle = "rgba(255,255,255,.18)"; g.fill();
    g.restore();
  };
  // border wall of rocks, so the world has edges
  for (let x = 0; x <= Z.w; x += 70) { addRock(x + r() * 30, -20 + r() * 30, 50 + r() * 40); addRock(x + r() * 30, Z.h + 20 - r() * 30, 50 + r() * 40); }
  for (let y = 0; y <= Z.h; y += 70) { addRock(-20 + r() * 30, y + r() * 30, 50 + r() * 40); addRock(Z.w + 20 - r() * 30, y + r() * 30, 50 + r() * 40); }
  for (let i = 0; i < 14; i++) addRock(150 + r() * (Z.w - 300), 150 + r() * (Z.h - 300), 18 + r() * 34);
  // weed / coral / grass patches
  for (let i = 0; i < 70; i++) {
    const x = r() * Z.w, y = r() * Z.h;
    g.save(); g.translate(x, y); g.rotate(r() * 6.3);
    if (Z.kind === "land") {
      g.strokeStyle = pal.weed; g.lineWidth = 2.5; g.lineCap = "round";
      for (let k = 0; k < 7; k++) { const a = r() * 6.3, L = 6 + r() * 10; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(Math.cos(a) * L * 0.5 + 3, Math.sin(a) * L * 0.5, Math.cos(a) * L, Math.sin(a) * L); g.stroke(); }
    } else if (r() < 0.5) {
      g.fillStyle = ["#ff6f91", "#ffb347", "#c77dff", "#ff8a5c"][irnd(0, 3)]; g.globalAlpha = Z.kind === "deep" ? 0.35 : 0.75;
      for (let k = 0; k < 6; k++) { circle(g, Math.cos(k) * 8 * r(), Math.sin(k * 2) * 8 * r(), 3 + r() * 4); g.fill(); }
    } else {
      g.strokeStyle = pal.weed; g.lineWidth = 3; g.lineCap = "round"; g.globalAlpha = 0.8;
      for (let k = 0; k < 5; k++) { const a = r() * 6.3, L = 10 + r() * 16; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(Math.cos(a + 0.5) * L * 0.6, Math.sin(a + 0.5) * L * 0.6, Math.cos(a) * L, Math.sin(a) * L); g.stroke(); }
    }
    g.restore();
  }
  if (Z.kind === "land") {                    // shells + footprint-like dents
    for (let i = 0; i < 40; i++) { const x = r() * Z.w, y = 380 + r() * (Z.h - 380);
      g.save(); g.translate(x, y); g.rotate(r() * 6.3); g.beginPath(); g.moveTo(0, 6); g.arc(0, 0, 6, 0.3, Math.PI - 0.3, true); g.closePath();
      strokeFill(g, ["#ffe0ea", "#fff2d6", "#ffd1a8"][irnd(0, 2)], "rgba(110,70,40,.6)", 1.5); g.restore(); }
  }
  return { canvas: c, rocks };
}
// tileable caustic light pattern (the wobbly bright net you see on a sunny sea floor)
let causticTile = null;
function getCaustics() {
  if (causticTile) return causticTile;
  const S = 256, c = makeCanvas(S, S), g = c.getContext("2d"), r = seeded(42);
  g.strokeStyle = "rgba(255,255,255,1)"; g.lineWidth = 2.2; g.lineCap = "round";
  for (let i = 0; i < 46; i++) {
    const x = r() * S, y = r() * S, rr = 14 + r() * 26;
    for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
      g.beginPath();
      for (let k = 0; k <= 7; k++) { const a = k / 7 * Math.PI * 2, q = rr * (0.7 + 0.3 * Math.sin(k * 3 + i)); const px = x + ox + Math.cos(a) * q, py = y + oy + Math.sin(a) * q; k ? g.lineTo(px, py) : g.moveTo(px, py); }
      g.stroke();
    }
  }
  causticTile = c;

}

// The creature, version 2 (adds tier 4/5 looks + mutations + helmet)
function drawCreature(g, x, y, ang, k, L) {
  const R = 24, st = L.stats, plant = L.type === "plant", mut = L.mut || {};
  const S = k * (st.eat >= 5 ? 1.22 : st.eat >= 3 ? 1.12 : 1);
  g.save();
  g.translate(x, y); g.rotate(ang); g.scale(S, S);
  g.lineJoin = "round"; g.lineCap = "round";
  if (Math.max(st.atk, st.eat, st.def) >= 5) drawAura(g, R, L);
  if (mut.regen) drawRegenGlow(g, R, L, mut.regen);
  if (L.legs) drawLegs(g, R, L);
  if (L.evolved) drawTail(g, R, L);
  if (mut.speed) drawSideFins(g, R, L, mut.speed);
  if (plant) drawVines(g, R, Object.assign({}, L, { reach: mut.reach || 0 }));
  if (st.def >= 1) drawSpikes(g, R, L);
  drawBody(g, R, ang, L);
  if (st.eat >= 4) drawGlowSpots(g, R, L);
  if (st.def >= 2) drawPlates(g, R, st.def >= 4);
  if (st.atk >= 1) drawKnobs(g, R, L);
  if (st.atk >= 4) drawHorns(g, R, L);
  if (st.atk >= 3) drawWarPaint(g, R);
  drawEyes(g, R, L);
  if (!plant) {
    g.save(); if (mut.reach) { g.translate(R, 0); g.scale(1 + mut.reach * 0.18, 1 + mut.reach * 0.12); g.translate(-R, 0); }
    if (st.eat >= 1) drawJaws(g, R, L); else drawClaws(g, R, L);
    g.restore();
  }
  if (mut.poison) drawPoison(g, R, L, mut.poison);
  if (st.eat >= 2) drawFeelers(g, R, L);
  if (L.flash > 0) { circle(g, 0, 0, R + 1); g.fillStyle = `rgba(255,255,255,${L.flash * 0.75})`; g.fill(); }
  if (L.helmet) drawHelmet(g, R, L);
  g.restore();
}
function drawPlates(g, R, crystal) {          // armour plates; DEFENCE 4 turns them to crystal
  for (let k = -1; k <= 1; k++) {
    const a = Math.PI + k * 0.78, h = 0.32;
    g.beginPath(); g.arc(0, 0, R + 1.5, a - h, a + h); g.arc(0, 0, R * 0.5, a + h * 0.8, a - h * 0.8, true); g.closePath();
    const gr = g.createRadialGradient(0, 0, R * 0.5, 0, 0, R + 2);
    gr.addColorStop(0, crystal ? "#b8f0ff" : "#1a9b44"); gr.addColorStop(1, crystal ? "#2a7fb8" : "#0b6a2a");
    strokeFill(g, gr, crystal ? "#0b2f52" : COL.line, 2.2);
    g.beginPath(); g.arc(0, 0, R - 1.5, a - h * 0.75, a + h * 0.75); g.strokeStyle = crystal ? "rgba(255,255,255,.8)" : "rgba(170,255,190,.55)"; g.lineWidth = 1.6; g.stroke();
  }
}
function drawHorns(g, R, L) {                // ATTACK 4: two curved bone horns
  for (const s of [-1, 1]) {
    g.save(); g.scale(1, s);
    g.beginPath(); g.moveTo(R * 0.25, -R * 0.78); g.quadraticCurveTo(R * 0.7, -R * 1.45, R * 1.35, -R * 1.25);
    g.quadraticCurveTo(R * 0.85, -R * 1.1, R * 0.62, -R * 0.62); g.closePath();
    strokeFill(g, radial(g, R * 0.7, -R, R * 0.6, ["#ffffff", "#e9e2cf", "#a89c7d"]), "#5a4e33", 2.2);
    g.strokeStyle = "rgba(90,78,51,.5)"; g.lineWidth = 1.2;
    for (const k of [0.35, 0.55, 0.75]) { g.beginPath(); g.moveTo(R * (0.3 + k * 0.8), -R * (0.85 + k * 0.4)); g.lineTo(R * (0.45 + k * 0.8), -R * (0.7 + k * 0.4)); g.stroke(); }
    g.restore();
  }
}
function drawGlowSpots(g, R, L) {            // EAT 4: glowing spots
  g.save(); g.globalCompositeOperation = "lighter";
  [[-10, 7], [-4, -12], [-14, -3], [2, 13], [-8, -1], [6, -4]].forEach(([x, y], i) => {
    const p = 0.55 + 0.45 * Math.sin(L.t * 3 + i);
    circle(g, x, y, 4.5); g.fillStyle = radial(g, x, y, 4.5, [`rgba(140,255,240,${0.9 * p})`, "rgba(0,0,0,0)"], 0, 0); g.fill();
  });
  g.restore();
}
function drawAura(g, R, L) {                 // any stat at 5: golden aura
  g.save(); g.globalCompositeOperation = "lighter";
  const p = 0.6 + 0.4 * Math.sin(L.t * 4);
  circle(g, 0, 0, R + 22); g.fillStyle = radial(g, 0, 0, R + 22, ["rgba(255,220,90,0)", `rgba(255,210,70,${0.28 * p})`, "rgba(255,200,60,0)"], 0, 0); g.fill();
  g.restore();
}
function drawRegenGlow(g, R, L, lvl) {
  g.save(); g.globalCompositeOperation = "lighter";
  const p = 0.5 + 0.5 * Math.sin(L.t * 2.5);
  circle(g, 0, 0, R + 9); g.fillStyle = radial(g, 0, 0, R + 9, ["rgba(90,255,140,0)", `rgba(90,255,140,${0.12 * lvl * p})`, "rgba(90,255,140,0)"], 0, 0); g.fill();
  g.restore();
}
function drawSideFins(g, R, L, lvl) {        // SPEED: little side fins
  const flap = Math.sin(L.t * 14) * 0.25 * (0.3 + (L.moving || 0));
  for (const s of [-1, 1]) {
    g.save(); g.scale(1, s); g.translate(-R * 0.35, -R * 0.92); g.rotate(-0.5 - flap);
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-8, -10 - lvl * 3, -18 - lvl * 4, -6); g.quadraticCurveTo(-9, -1, 0, 3); g.closePath();
    strokeFill(g, "#7dfcff", "#0b4a5a", 2);
    g.restore();
  }
}
function drawPoison(g, R, L, lvl) {          // POISON: purple drips at the mouth
  g.save(); g.globalCompositeOperation = "lighter";
  for (const s of [-1, 1]) {
    const y = s * 7, x = R + 10 + Math.sin(L.t * 3 + s) * 1.5, drip = (L.t * 1.2 + (s + 1) * 0.3) % 1;
    circle(g, x, y + drip * 6 * s, 2.6 + lvl * 0.6); g.fillStyle = `rgba(200,90,255,${0.8 - drip * 0.5})`; g.fill();
  }
  g.restore();
}
function drawHelmet(g, R, L) {               // space bubble helmet
  circle(g, 0, 0, R + 12);
  g.fillStyle = radial(g, 0, 0, R + 12, ["rgba(200,240,255,.05)", "rgba(180,230,255,.12)", "rgba(170,220,255,.35)"], 0, 0); g.fill();
  g.lineWidth = 2.2; g.strokeStyle = "rgba(225,245,255,.75)"; g.stroke();
  g.beginPath(); g.arc(0, 0, R + 8, -2.4, -1.5); g.lineWidth = 3; g.strokeStyle = "rgba(255,255,255,.7)"; g.stroke();
  g.beginPath(); g.arc(-R - 12, 0, 4, 0, Math.PI * 2); g.fillStyle = "#b7c2d4"; g.fill(); g.strokeStyle = "#3a4458"; g.lineWidth = 1.5; g.stroke();
}

// ---------------------------------------------------------------- enemies v2
function drawEnemy(g, e, t) {
  if (e.type === "worm") return drawWorm(g, e, t);
  const sc = e.scale || 1, D = ENEMY[e.type];
  if (e.alpha) {
    if (!LOW()) glowAt(g, e.x, e.y, D.r * sc * 1.9, "255,190,50", 0.5);
  }
  g.save(); g.translate(e.x, e.y); g.scale(sc, sc); g.translate(-e.x, -e.y);
  if (e.type === "mite") drawMite(g, e, t);
  else if (e.type === "dustling") drawDustling(g, e, t);
  else drawEnemyBase(g, e, t);
  g.restore();
  if (e.poisonT > 0) {
    g.save(); g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 3; i++) { const a = t * 3 + i * 2.1, rr = D.r * sc * 0.8; circle(g, e.x + Math.cos(a) * rr, e.y + Math.sin(a) * rr - ((t * 20 + i * 7) % 14), 3); g.fillStyle = "rgba(200,90,255,.7)"; g.fill(); }
    g.restore();
  }
  if (e.alpha) drawCrown(g, e.x, e.y - D.r * sc - 14, 1 + sc * 0.1, t);
}
function drawCrown(g, x, y, s, t) {
  g.save(); g.translate(x, y + Math.sin(t * 3) * 2); g.scale(s, s); g.lineJoin = "round";
  g.beginPath(); g.moveTo(-14, 7); g.lineTo(-16, -6); g.lineTo(-8, 0); g.lineTo(0, -10); g.lineTo(8, 0); g.lineTo(16, -6); g.lineTo(14, 7); g.closePath();
  strokeFill(g, radial(g, 0, 0, 16, ["#fff6b0", "#ffcf2e", "#c98a00"]), "#5a3a00", 2.2);
  for (const [cx, c] of [[-8, "#ff4a6a"], [0, "#4ad8ff"], [8, "#ff4a6a"]]) { circle(g, cx, 3, 2.2); g.fillStyle = c; g.fill(); }
  g.restore();
}
function drawMite(g, e, t) {                 // moon mite: grey cyclops bug that hops
  const hop = e.state === "lunge" ? Math.sin(Math.PI * clamp(1 - e.timer / 0.26, 0, 1)) : 0;
  const fl = e.flash > 0;
  if (hop > 0) shadow(g, e.x + 4, e.y + 10, 14, 9, 0.25);
  g.save(); g.translate(e.x, e.y - hop * 18); g.rotate(e.ang); g.scale(1 + hop * 0.25, 1 + hop * 0.25);
  g.lineCap = "round"; g.lineJoin = "round";
  const step = Math.sin(t * 18 + e.seed) * (e.moving ? 1 : 0.2);
  for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
    const bx = -6 + i * 7, sw = (i % 2 ? step : -step) * 3;
    g.beginPath(); g.moveTo(bx, s * 8); g.lineTo(bx + sw - 2, s * 18); g.lineTo(bx + sw - 6, s * 24);
    g.lineWidth = 4.5; g.strokeStyle = "#20202c"; g.stroke(); g.lineWidth = 2.2; g.strokeStyle = fl ? "#fff" : "#9a9ab8"; g.stroke();
  }
  g.beginPath(); g.ellipse(-2, 0, 16, 13, 0, 0, Math.PI * 2);
  strokeFill(g, fl ? "#fff" : radial(g, -2, 0, 16, ["#e8e6ff", "#a3a0c8", "#55527a"]), "#20202c", 2.6);
  g.strokeStyle = "rgba(40,40,70,.35)"; g.lineWidth = 1.6;
  g.beginPath(); g.arc(-6, 0, 9, -1.2, 1.2); g.stroke();
  const wind = e.state === "windup";
  circle(g, 8, 0, 6.5); g.fillStyle = "#fff"; g.fill(); g.strokeStyle = "#20202c"; g.lineWidth = 1.8; g.stroke();
  circle(g, 9.5, 0, wind ? 4.2 : 3.2); g.fillStyle = wind ? "#ff3b3b" : "#2bd16a"; g.fill();
  circle(g, 10.5, 0, 1.6); g.fillStyle = "#000"; g.fill();
  g.beginPath(); g.moveTo(4, -9); g.quadraticCurveTo(10, -18, 16, -15); g.moveTo(4, 9); g.quadraticCurveTo(10, 18, 16, 15); g.lineWidth = 1.6; g.strokeStyle = "#20202c"; g.stroke();
  g.restore();
}
function drawDustling(g, e, t) {             // mars dustling: spinning red spiky tumbler
  const fl = e.flash > 0, spin = t * (e.state === "lunge" ? 18 : 6) + e.seed;
  g.save(); g.translate(e.x, e.y); g.lineJoin = "round";
  g.save(); g.rotate(spin);
  g.fillStyle = fl ? "#fff" : "#7a2a12"; g.strokeStyle = "#2a0a02"; g.lineWidth = 1.5;
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a), r1 = e.state === "windup" ? 30 : 25;
    g.beginPath(); g.moveTo(c * 14 - s * 4, s * 14 + c * 4); g.lineTo(c * r1, s * r1); g.lineTo(c * 14 + s * 4, s * 14 - c * 4); g.closePath(); g.fill(); g.stroke();
  }
  circle(g, 0, 0, 17);
  strokeFill(g, fl ? "#fff" : radial(g, 0, 0, 17, ["#ffb07a", "#e0521e", "#7a2408"]), "#2a0a02", 2.6);
  g.strokeStyle = "rgba(60,15,0,.45)"; g.lineWidth = 2;
  for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(0, 0, 6 + i * 4, i, i + 2.2); g.stroke(); }
  g.restore();
  g.rotate(e.ang);
  for (const s of [-1, 1]) {
    g.save(); g.translate(6, s * 5);
    circle(g, 0, 0, 3.6); g.fillStyle = "#fff"; g.fill(); circle(g, 0.8, 0, 2); g.fillStyle = "#000"; g.fill();
    g.beginPath(); g.moveTo(-4, -s * 4.5); g.lineTo(4, -s * 2.5); g.lineWidth = 2; g.strokeStyle = "#2a0a02"; g.stroke();
    g.restore();
  }
  g.restore();
}
function drawWorm(g, e, t) {                 // THE SAND WORM (final boss)
  if (e.state === "burrow") {
    const k = 1 - e.timer / e.burrowDur;
    g.save();
    g.fillStyle = `rgba(90,30,10,${0.15 + k * 0.3})`; g.beginPath(); g.ellipse(e.tx, e.ty, 50 + k * 30, 34 + k * 20, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = `rgba(255,60,30,${0.4 + 0.5 * (Math.sin(t * 22) * 0.5 + 0.5)})`; g.lineWidth = 3; g.setLineDash([8, 7]);
    g.beginPath(); g.ellipse(e.tx, e.ty, 72, 48, 0, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
    for (let i = 0; i < 6; i++) { const a = t * 2 + i; circle(g, e.tx + Math.cos(a * 1.7) * 30 * k, e.ty + Math.sin(a * 2.3) * 20 * k, 4 + (i % 3)); g.fillStyle = "rgba(170,80,40,.6)"; g.fill(); }
    g.restore();
    return;
  }
  const fl = e.flash > 0;
  g.save(); g.lineJoin = "round";
  for (let i = e.segs.length - 1; i >= 0; i--) {
    const s = e.segs[i], r = 34 - i * 1.7, prev = i ? e.segs[i - 1] : e, a = Math.atan2(prev.y - s.y, prev.x - s.x);
    shadow(g, s.x + 8, s.y + 12, r, r * 0.7, 0.22);
    g.save(); g.translate(s.x, s.y); g.rotate(a);
    circle(g, 0, 0, r);
    strokeFill(g, fl ? "#fff" : radial(g, 0, 0, r, ["#ffb48a", i % 2 ? "#c8532a" : "#d8642f", "#5e1c08"]), "#2a0a02", 3);
    g.beginPath(); g.arc(0, 0, r * 0.75, -1.1, 1.1); g.strokeStyle = "rgba(60,15,0,.4)"; g.lineWidth = 3; g.stroke();
    g.fillStyle = "#f2e0c8"; g.strokeStyle = "#3a1a08"; g.lineWidth = 1.2;
    for (const sd of [-1, 1]) { g.beginPath(); g.moveTo(-5, sd * r * 0.85); g.lineTo(0, sd * (r + 8)); g.lineTo(5, sd * r * 0.85); g.closePath(); g.fill(); g.stroke(); }
    g.restore();
  }
  // head
  const open = e.state === "windup" ? 1 : e.state === "lunge" ? 0.7 : 0.25 + Math.sin(t * 3) * 0.1;
  shadow(g, e.x + 10, e.y + 14, 44, 30, 0.25);
  g.save(); g.translate(e.x, e.y); g.rotate(e.ang);
  for (const s of [-1, 1]) for (const k of [0, 1]) {
    g.save(); g.scale(1, s); g.translate(30, -12 - k * 10); g.rotate(-open * 0.6 - k * 0.3);
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(22, -14, 34, 4); g.quadraticCurveTo(20, -4, 0, 8); g.closePath();
    strokeFill(g, fl ? "#fff" : "#f2e0c8", "#3a1a08", 2.4);
    g.restore();
  }
  circle(g, 0, 0, 42);
  strokeFill(g, fl ? "#fff" : radial(g, 0, 0, 42, ["#ffc39e", "#d8642f", "#5e1c08"]), "#2a0a02", 3.5);
  circle(g, 20, 0, 16 + open * 6); g.fillStyle = "#2a0006"; g.fill();
  g.fillStyle = "#f2e0c8";
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, rr = 16 + open * 6; g.beginPath(); g.moveTo(20 + Math.cos(a) * rr, Math.sin(a) * rr); g.lineTo(20 + Math.cos(a + 0.2) * rr * 0.55, Math.sin(a + 0.2) * rr * 0.55); g.lineTo(20 + Math.cos(a + 0.4) * rr, Math.sin(a + 0.4) * rr); g.fill(); }
  for (const s of [-1, 1]) { g.save(); glowAt(g, -6, s * 22, 14, "255,234,0", 0.8); circle(g, -6, s * 22, 4.5); g.fillStyle = "#ffe14a"; g.fill(); circle(g, -5, s * 22, 2); g.fillStyle = "#000"; g.fill(); g.restore(); }
  g.restore();
  g.restore();
}

// gulls (shore) and meteors (moon) share the same "shadow warns you" idea
function drawGull(gl, g, t) {
  if (gl.kind !== "meteor") return drawGullBase(gl, g, t);
  const k = Math.min(1, gl.t / gl.dur);
  if (gl.t >= gl.dur) {                       // impact flash
    const a = 1 - (gl.t - gl.dur) / 0.5;
    g.save(); g.globalCompositeOperation = "lighter"; circle(g, gl.x, gl.y, 70 * (1.2 - a * 0.4));
    g.fillStyle = radial(g, gl.x, gl.y, 70, [`rgba(255,200,80,${a * 0.8})`, "rgba(255,80,0,0)"], 0, 0); g.fill(); g.restore();
    return;
  }
  g.save(); g.fillStyle = `rgba(30,10,0,${0.1 + k * 0.3})`; g.beginPath(); g.ellipse(gl.x, gl.y, 20 + k * 40, 13 + k * 26, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = `rgba(255,90,40,${0.3 + 0.5 * k * (Math.sin(t * 20) * 0.5 + 0.5)})`; g.lineWidth = 2.5; g.setLineDash([6, 6]);
  g.beginPath(); g.ellipse(gl.x, gl.y, 62, 42, 0, 0, Math.PI * 2); g.stroke(); g.setLineDash([]); g.restore();
  const mx = lerp(gl.sx, gl.x, k * k), my = lerp(gl.sy, gl.y, k * k), a = Math.atan2(gl.y - gl.sy, gl.x - gl.sx);
  g.save(); g.globalCompositeOperation = "lighter";
  const tx = mx - Math.cos(a) * 90, ty = my - Math.sin(a) * 90, gr = g.createLinearGradient(mx, my, tx, ty);
  gr.addColorStop(0, "rgba(255,220,120,.9)"); gr.addColorStop(1, "rgba(255,60,0,0)");
  g.strokeStyle = gr; g.lineWidth = 16; g.lineCap = "round"; g.beginPath(); g.moveTo(mx, my); g.lineTo(tx, ty); g.stroke();
  g.restore();
  g.save(); g.translate(mx, my); g.rotate(t * 4);
  g.beginPath(); for (let i = 0; i <= 8; i++) { const aa = i / 8 * Math.PI * 2, rr = 13 * (0.8 + ((i * 7) % 5) / 12); i ? g.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr) : g.moveTo(Math.cos(aa) * rr, Math.sin(aa) * rr); }
  g.closePath(); strokeFill(g, radial(g, 0, 0, 13, ["#c9b8a6", "#7d6a58", "#3a2d22"]), "#1a120c", 2);
  g.restore();
}

// ---------------------------------------------------------------- moon + mars floors
function buildFloor(z) {
  const Z = ZONES[z];
  if (Z.kind !== "moon" && Z.kind !== "mars") return buildFloorBase(z);
  const r = seeded(z * 977 + 3), moon = Z.kind === "moon";
  const c = makeCanvas(Z.w * FLOOR_RES, Z.h * FLOOR_RES), g = c.getContext("2d");
  g.scale(FLOOR_RES, FLOOR_RES);
  const bg = g.createLinearGradient(0, 0, Z.w * 0.3, Z.h);
  bg.addColorStop(0, moon ? "#a9adb6" : "#e07a3e"); bg.addColorStop(1, moon ? "#6f737d" : "#9a3a14");
  g.fillStyle = bg; g.fillRect(0, 0, Z.w, Z.h);
  for (let i = 0; i < 70; i++) { const x = r() * Z.w, y = r() * Z.h, rr = 60 + r() * 220;
    circle(g, x, y, rr); g.fillStyle = radial(g, x, y, rr, [r() < 0.5 ? "rgba(255,255,255,.07)" : "rgba(0,0,0,.09)", "rgba(0,0,0,0)"], 0, 0); g.fill(); }
  if (!moon) { g.strokeStyle = "rgba(255,200,150,.12)"; g.lineWidth = 3;
    for (let i = 0; i < 160; i++) { const x = r() * Z.w, y = r() * Z.h, L = 30 + r() * 90; g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + L * 0.3, y - 7, x + L * 0.7, y + 7, x + L, y); g.stroke(); } }
  const crater = (x, y, rr) => {
    g.save(); g.translate(x, y);
    g.beginPath(); g.ellipse(0, 0, rr, rr * 0.82, 0, 0, Math.PI * 2); g.fillStyle = moon ? "rgba(40,42,52,.35)" : "rgba(70,20,5,.35)"; g.fill();
    g.beginPath(); g.ellipse(rr * 0.12, rr * 0.12, rr * 0.85, rr * 0.68, 0, 0, Math.PI * 2); g.fillStyle = moon ? "rgba(30,32,40,.25)" : "rgba(60,15,0,.25)"; g.fill();
    g.beginPath(); g.ellipse(0, 0, rr, rr * 0.82, 0, 0.3, Math.PI * 1.1); g.strokeStyle = "rgba(255,255,255,.28)"; g.lineWidth = Math.max(2, rr * 0.08); g.stroke();
    g.beginPath(); g.ellipse(0, 0, rr, rr * 0.82, 0, Math.PI * 1.2, Math.PI * 1.9); g.strokeStyle = "rgba(0,0,0,.25)"; g.stroke();
    g.restore();
  };
  for (let i = 0; i < (moon ? 60 : 22); i++) crater(r() * Z.w, r() * Z.h, 12 + Math.pow(r(), 2) * (moon ? 110 : 80));
  const rocks = [];
  const rock = (x, y, rr) => {
    rocks.push({ x, y, r: rr });
    g.save(); g.translate(x, y); shadow(g, 8, 10, rr * 1.05, rr * 0.85, 0.3);
    g.beginPath(); for (let i = 0; i <= 9; i++) { const a = i / 9 * Math.PI * 2, q = rr * (0.8 + r() * 0.25); i ? g.lineTo(Math.cos(a) * q, Math.sin(a) * q) : g.moveTo(Math.cos(a) * q, Math.sin(a) * q); }

    if (RUN.kills % 4 === 0) giveDNA(1, e.x, e.y);
  }
  if (e.alpha) {
    save.totals.alphas++; giveDNA(5, e.x, e.y);
    if (save.totals.alphas >= 5) unlock("alpha");
    toast("ALPHA DEFEATED!", null, 2.2);
  }
  addMeter(e.reward, e.x, e.y);
}
function heal(n) {
  if (P.dead) return;
  const before = P.hp;
  P.hp = Math.min(maxHp(), P.hp + n);
  if (P.hp - before >= 1) SYN.heal();
}
function hurtPlayer(dmg, src) {
  if (P.inv > 0 || P.dead > 0 || G.scene !== "play" || W.complete || W.bossDead > 0) return;   // BUG FIX: no damage during the zone-complete / boss-dead moment
  const d = Math.max(1, dmg - RUN.stats.def);
  P.hp -= d; P.inv = 1.0; P.flash = 1; P.safeT = 0; W.hits++;
  cam.shake = 0.6; G.hitstop = 0.06;
  SYN.hurt();
  if (src) { const a = Math.atan2(P.y - src.y, P.x - src.x); P.vx += Math.cos(a) * 420; P.vy += Math.sin(a) * 420; }
  W.popups.push({ x: P.x, y: P.y - 34, text: "-" + d, col: "#ff5a5a", t: 0.9 });
  if (src && RUN.stats.def > 0 && W.enemies.includes(src)) damageEnemy(src, RUN.stats.def, "hit");   // thorns!
  if (P.hp <= 0) playerDie();
}
function playerDie() {
  P.dead = 2.6; P.hp = 0; RUN.deaths++; P.anim = null; P.dashT = 0;
  SYN.die(); cam.shake = 1;
  for (let i = 0; i < 40; i++) { const a = rnd(0, 6.3), s = rnd(40, 260);
    W.parts.push({ type: "dot", x: P.x, y: P.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.5, 1.1), max: 1.1, col: "34,212,85", size: rnd(2, 5) }); }
}
function respawn() {
  P.dead = 0; P.hp = maxHp(); P.inv = 2.2; P.vx = P.vy = 0; P.safeT = 0; P.flash = 0;
  if (!W.bossPhase) {
    const lost = Math.floor(RUN.meter * (shopLvl("second") ? 0.15 : 0.3));
    RUN.meter -= lost; W.barShown = RUN.meter;
    toast("You got eaten!", lost ? `Lost ${lost} evolution points` : "Try again", 2.6);
  } else if (W.boss) {                     // BUG FIX: the boss may already be dead here
    W.boss.hp = Math.min(W.boss.maxHp, W.boss.hp + Math.round(W.boss.maxHp * 0.05));
    toast("You got eaten!", "The boss healed a little. Keep going!", 2.6);
    const p = freeSpot(600); W.boss.x = p.x; W.boss.y = p.y; W.boss.state = "roam";
    if (W.boss.segs) W.boss.segs.forEach((s, i) => { s.x = p.x - (i + 1) * 30; s.y = p.y; });
  }
  W.enemies = W.enemies.filter(e => ENEMY[e.type].boss || e.type === "prey" || e.alpha || dist(e, P) > 650);
  W.gulls = W.gulls.filter(gl => gl.t >= gl.dur);
}
function addMeter(n, x, y) {
  if (W.bossPhase || W.complete) return;
  RUN.meter += n;
  W.popups.push({ x, y: y - 20, text: "+" + n, col: "#7dfcff", t: 0.9 });
}

// ---------------------------------------------------------------- bosses: THE APEX (shore) and THE SAND WORM (mars)
function startBoss() {
  const Z = W.Z;
  W.bossPhase = true;
  RUN.meter = Z.goal;
  W.enemies = W.enemies.filter(e => dist(e, P) < 300 && !e.alpha);
  const b = spawnEnemy(Z.boss, { x: clamp(P.x + (P.x > Z.w / 2 ? -500 : 500), 300, Z.w - 300), y: Z.boss === "boss" ? 130 : clamp(P.y - 350, 200, Z.h - 200) });
  b.state = "chase"; W.boss = b;
  stopAllSounds(); music("Movie 1", 0.5);
  SYN.roar(); cam.shake = 1.2;
  toast(ENEMY[Z.boss].name + " HAS COME!", Z.boss === "boss" ? "Beat it to reach the stars" : "Beat it to become the ruler of Mars", 4);
}
function bossDefeated(e) {
  W.bossDead = 3; G.slowmo = 1.2; cam.shake = 1.5;
  SYN.roar(); sfx("Win", 1);
  W.bossLast = { hp: 0, maxHp: e.maxHp, type: e.type };   // keep the bar visible while it drains to empty
  W.boss = null;
  if (e.type === "boss") { unlock("apex"); giveDNA(15, e.x, e.y); toast("YOU ARE THE APEX!", null, 3); }
  else { unlock("worm"); giveDNA(25, e.x, e.y); toast("THE SAND WORM IS DEFEATED!", null, 3); }
  W.enemies = W.enemies.filter(x => x.type === "prey");
}

// ---------------------------------------------------------------- evolving
const EVO_TXT = {
  attack: { name: "ATTACK", col: "#ff5a4f", main: "+1 damage on every hit",
    feat: ["", "Grow brown knobs", "Knobs get bone spikes", "War paint + red eyes", "Bone horns", "Golden aura"] },
  eat: { name: "EAT", col: "#ffd23f", main: "More per meal, heal more, pull food in",
    feat: ["", "BIG", "Glowing feelers", "Bigger body", "Glowing spots", "Even bigger + golden aura"] },
  defence: { name: "DEFENCE", col: "#5fb8ff", main: "+3 max HP, -1 damage, spikes hurt biters",
    feat: ["", "White spikes all around", "Armour plates", "Longer spikes", "Crystal armour", "Golden aura"] },
};
const STAT_KEY = { attack: "atk", eat: "eat", defence: "def" };
function featText(kind, lvl) {
  if (kind === "eat" && lvl === 1) return RUN.type === "meat" ? "Big box jaws" : "Three vines";
  return EVO_TXT[kind].feat[Math.min(5, lvl)];
}
function completeZone() {              // zone done: let the bar show FULL for a moment (bug fix), then evolve / finish
  if (W.complete) return;
  W.complete = 1.1;
  if (W.hits === 0) unlock("untouched");
  giveDNA(5, P.x, P.y);
  SYN.sparkle();
}
function toEvolve() {
  G.scene = "evolve"; G.evoT = 0; G.evoPicked = null;
  stopAllSounds(); sfx("Triumph", 1); SYN.sparkle();
  W.food = []; W.enemies = []; W.gulls = []; W.storm = null;
  // two random mutations to choose from, besides his three
  const pool = Object.keys(MUTS).filter(k => RUN.mut[k] < MUTS[k].max);
  for (let i = pool.length - 1; i > 0; i--) { const j = irnd(0, i); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  G.evoChoices = ["attack", "eat", "defence"].concat(pool.slice(0, 2));
}
function pickEvolution(kind) {
  if (G.evoPicked || G.scene !== "evolve") return;
  G.evoPicked = kind; SYN.click(); SYN.sparkle();
  if (STAT_KEY[kind]) {
    if (!RUN.first) RUN.first = kind;
    RUN.stats[STAT_KEY[kind]]++;
  } else RUN.mut[kind] = Math.min(MUTS[kind].max, RUN.mut[kind] + 1);
  RUN.evolved = true; RUN.evos = (RUN.evos || 0) + 1;
  unlock("evolve");
  if (mutCount() >= 3) unlock("mutant");
  const next = RUN.zone + 1;
  if (next >= 3) RUN.legs = true;
  if (next >= 4) RUN.helmet = true;
  go(() => startZone(next));
}

// ---------------------------------------------------------------- ending
function runTitle() {
  const s = RUN.stats, m = Math.max(s.atk, s.eat, s.def), tops = ["atk", "eat", "def"].filter(k => s[k] === m);
  return tops.length > 1 ? "THE SURVIVOR" : { atk: "THE HUNTER", eat: "THE GLUTTON", def: "THE FORTRESS" }[tops[0]];
}
function finishGame() {
  const title = runTitle(), key = RUN.type + ":" + title;
  giveDNA(20);
  const prev = save.best[key];
  const isNew = !save.found.includes(key);
  if (isNew) save.found.push(key);
  if (RUN.hard && !save.hardFound.includes(key)) save.hardFound.push(key);
  if (!(prev >= 0) || RUN.time < prev) save.best[key] = RUN.time;
  save.wins = (+save.wins || 0) + 1;
  writeSave();
  if (RUN.deaths === 0) unlock("nodeath");
  if (RUN.time < 600) unlock("speedrun");
  if (RUN.hard) unlock("hard");
  if (save.found.length >= 8) unlock("collector");
  RUN.end = { title, key, best: save.best[key], record: prev >= 0 && RUN.time < prev, isNew, t: 0 };
  resetTransient();
  G.scene = "ending";
  stopAllSounds(); music("Dance Energetic", 0.5); ambience("space");
}

// ---------------------------------------------------------------- input routing
function onClick(ux, uy, pointerType, btn) {
  startAudioOnce();
  if (G.fadeDir) return;                  // BUG FIX: no clicks on a screen that is fading away
  if (btn === 2) { dashPressed(); return; }
  for (let i = G.buttons.length - 1; i >= 0; i--) {
    const b = G.buttons[i];
    if (ux >= b.x && ux <= b.x + b.w && uy >= b.y && uy <= b.y + b.h) { if (b.click) { SYN.click(); b.click(); } return; }
  }
  if (G.scene === "play" && !G.paused && pointerType !== "touch") attackPressed();
}
function onKey(code) {
  startAudioOnce();
  if (code === "KeyE" || code === "Space" || code === "KeyJ") attackPressed();
  if (code === "ShiftLeft" || code === "ShiftRight" || code === "KeyK") dashPressed();
  if (code === "KeyM") { save.muted = !save.muted; applyVolume(); }
  if (code === "Minus" || code === "NumpadSubtract") { save.vol = clamp(Math.round((save.vol - 0.2) * 5) / 5, 0, 1); save.muted = false; applyVolume(); }
  if (code === "Equal" || code === "NumpadAdd") { save.vol = clamp(Math.round((save.vol + 0.2) * 5) / 5, 0, 1); save.muted = false; applyVolume(); }
  if ((code === "KeyP" || code === "Escape") && G.scene === "play" && !G.fadeDir) G.paused = !G.paused;
  if (code === "Escape" && (G.scene === "collection" || G.scene === "shop")) go(toMenu);
  if (code === "Enter" && G.scene === "menu") go(toChoose);
}
function autoPause() { if (G.scene === "play") G.paused = true; }
function touchOnButton(e) {
  if (G.scene !== "play" || G.paused) return false;
  const r = canvas.getBoundingClientRect();
  const ux = (e.clientX - r.left) * DPR / UI, uy = (e.clientY - r.top) * DPR / UI;
  if (Math.hypot(ux - 90, uy - (VH - 150)) < 60) { G.touchBtn = "attack"; return true; }
  if (RUN && RUN.mut.dash && Math.hypot(ux - 200, uy - (VH - 110)) < 46) { G.touchBtn = "dash"; return true; }
  return false;
}
function onAttackButton() { if (G.touchBtn === "dash") dashPressed(); else attackPressed(); }

// ---------------------------------------------------------------- PLAY tick
function tickPlay(dt) {
  const Z = W.Z;
  RUN.time += dt;
  P.inv = Math.max(0, P.inv - dt); P.flash = Math.max(0, P.flash - dt * 4);
  P.blinkT -= dt; if (P.blinkT <= 0) { P.blink = 0.12; P.blinkT = rnd(2, 5); } P.blink = Math.max(0, P.blink - dt);
  P.dashCd = Math.max(0, P.dashCd - dt);
  if (W.tipT > 0) { W.tipT -= dt; if (W.tipT <= 0) toast(W.tip, null, 4.5); }

  if (P.dead > 0) {
    P.dead -= dt;
    if (P.dead <= 0) respawn();
  } else {
    // --- steering: his rule "if distance to mouse > 40: point towards mouse and move"
    const m = screenToWorld(mouse.sx, mouse.sy);
    let dx = m.x - P.x, dy = m.y - P.y, d = Math.hypot(dx, dy), want = 0;
    const kx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    const ky = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
    if (kx || ky) { dx = kx; dy = ky; d = 999; }
    if (d > 40 && (mouse.moved || kx || ky)) want = clamp((d - 40) / 90, 0, 1);
    if (P.moveDelay > 0) { P.moveDelay -= dt; want = 0; }
    const speed = (isWater(Z.kind) ? 235 : 215) * (1 + 0.15 * RUN.mut.speed) * (1 + 0.05 * shopLvl("speed")) * (P.anim && P.anim.kind === "attack" ? 0.75 : 1);
    if (P.dashT > 0) {
      P.dashT -= dt;
      P.ghosts.push({ x: P.x, y: P.y, ang: P.ang, life: 0.25 });
    } else {
      const tvx = d > 0 ? dx / d * speed * want : 0, tvy = d > 0 ? dy / d * speed * want : 0;
      const k = 1 - Math.exp(-dt * (Z.kind === "moon" ? 2.2 : 7));      // the moon: floaty low gravity
      P.vx += (tvx - P.vx) * k; P.vy += (tvy - P.vy) * k;
    }
    if (W.storm) { const s = W.storm, env = Math.sin(Math.PI * clamp(s.t / s.dur, 0, 1)); P.x += Math.cos(s.ang) * 120 * env * dt; P.y += Math.sin(s.ang) * 120 * env * dt; }
    P.x += P.vx * dt; P.y += P.vy * dt;
    P.x = clamp(P.x, 70, Z.w - 70); P.y = clamp(P.y, 70, Z.h - 70);
    const sp = Math.hypot(P.vx, P.vy);
    P.moving = clamp(sp / 200, 0, 1);
    if (d > 40 && P.dashT <= 0) P.ang += angDiff(P.ang, Math.atan2(dy, dx)) * (1 - Math.exp(-dt * 10));
    const oldWalk = P.walk;
    P.walk += dt * Math.min(sp, 400) * 0.07;
    if (!isWater(Z.kind) && sp > 60 && Math.floor(P.walk / Math.PI) !== Math.floor(oldWalk / Math.PI)) SYN.step();
    P.trailT -= dt;
    if (sp > 120 && P.trailT <= 0) {
      P.trailT = 0.12;
      const bx = P.x - Math.cos(P.ang) * 30, by = P.y - Math.sin(P.ang) * 30;
      if (!isWater(Z.kind)) W.parts.push({ type: "dust", x: bx, y: by, vx: rnd(-20, 20), vy: rnd(-20, 20), life: 0.6, max: 0.6, size: rnd(4, 8), col: Z.kind });
      else W.parts.push({ type: "bubble", x: bx + rnd(-5, 5), y: by + rnd(-5, 5), vx: rnd(-10, 10), vy: -rnd(20, 50), life: rnd(0.8, 1.4), max: 1.4, size: rnd(2, 4.5) });
    }
    // regen mutation
    P.safeT += dt;
    if (RUN.mut.regen && P.safeT > 3) heal(0.4 * RUN.mut.regen * dt);
    tickAnim(dt);
  }
  for (const gh of P.ghosts) gh.life -= dt;
  P.ghosts = P.ghosts.filter(gh => gh.life > 0);

  // --- food: magnet, eating
  const R = playerRadius(), mag = (RUN.stats.eat > 0 ? 30 + 30 * RUN.stats.eat : 0) + 70 * RUN.mut.magnet;
  for (let i = W.food.length - 1; i >= 0; i--) {
    const f = W.food[i]; f.age += dt;
    if (P.dead) continue;
    const d = Math.hypot(f.x - P.x, f.y - P.y);
    if (mag && d < R + mag && d > 1) { f.x += (P.x - f.x) / d * 170 * dt; f.y += (P.y - f.y) / d * 170 * dt; }   // BUG FIX: d > 1 (no divide by zero = NaN)
    if (d < R + 19) {          // reach a bit past his 40px stop distance so food never sits just out of reach
      W.food.splice(i, 1);
      addMeter(mealGain(), f.x, f.y);
      heal((0.5 + 0.5 * RUN.stats.eat) * (RUN.hard ? 0.5 : 1));
      save.totals.eaten++; if (save.totals.eaten >= 500) unlock("glutton");
      if (!startAnim("eat")) sfx(RUN.type === "plant" ? "Rip" : "Bite", 0.8);
      const col = f.sprite === "meat" ? ["255,143,176", "201,139,85", "255,110,230"][f.v] : ["31,210,74", "155,74,18", "180,186,200"][f.v];
      for (let j = 0; j < 12; j++) { const a = rnd(0, 6.3), s = rnd(30, 150);
        W.parts.push({ type: "dot", x: f.x, y: f.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.3, 0.6), max: 0.6, col, size: rnd(1.5, 3.5) }); }
      if (isWater(Z.kind)) { for (let j = 0; j < 3; j++) W.parts.push({ type: "bubble", x: f.x + rnd(-6, 6), y: f.y, vx: rnd(-15, 15), vy: -rnd(30, 70), life: 1, max: 1, size: rnd(2, 4) }); SYN.bubble(0.05); }
    }
  }

  // --- spawners (stop once the zone is complete)
  const hardMul = RUN.hard ? 0.75 : 1;
  if (!W.complete) {
    W.foodT -= dt;
    if (W.foodT <= 0) { spawnFood(false); W.foodT = rnd(Z.food[0], Z.food[1]); }
    if (RUN.type === "meat" && Z.prey) {
      const n = W.enemies.filter(e => e.type === "prey").length;
      if (n < Z.prey) { W.preyT -= dt; if (W.preyT <= 0) { spawnEnemy("prey"); W.preyT = 4; } }
    }
    if (!W.bossPhase) Z.enemies.forEach((sp, i) => {
      if (RUN.meter < sp.after) return;
      W.enemyT[i] -= dt;
      if (W.enemyT[i] <= 0) {
        W.enemyT[i] = rnd(sp.every[0], sp.every[1]) * hardMul;
        if (W.enemies.filter(e => e.type === sp.type && !e.alpha).length < sp.max + (RUN.hard ? 1 : 0)) spawnEnemy(sp.type);
      }
    });
    // the mini-boss: an ALPHA shows up when the meter is half full
    if (!W.alphaDone && !W.bossPhase && Z.alpha && RUN.meter >= Z.goal * 0.5) {
      W.alphaDone = true;
      const a = spawnEnemy(Z.alpha, null, true); a.state = "chase";
      SYN.roar(); toast("An ALPHA " + ENEMY[Z.alpha].name.toUpperCase() + " appears!", "Beat it for a big bonus (+10)", 3);
    }
    const hz = Z.gulls || Z.meteors;
    if (hz && !P.dead) {
      W.gullT -= dt;
      if (W.gullT <= 0) {
        W.gullT = rnd(hz[0], hz[1]) * (W.bossPhase ? 1.5 : 1) * hardMul;
        const tx = clamp(P.x + P.vx * 0.55, 80, Z.w - 80), ty = clamp(P.y + P.vy * 0.55, 80, Z.h - 80), side = Math.random() < 0.5 ? -1 : 1;
        W.gulls.push({ kind: Z.meteors ? "meteor" : "gull", x: tx, y: ty, sx: tx + side * rnd(300, 700), sy: ty - 600, t: 0, dur: Z.meteors ? 1.6 : 1.5, hit: false });
        SYN.warn();
      }
    }
    if (Z.storms) {
      if (W.storm) { W.storm.t += dt; if (W.storm.t >= W.storm.dur) { W.storm = null; W.stormT = rnd(Z.storms[0], Z.storms[1]); } }
      else { W.stormT -= dt; if (W.stormT <= 0) { W.storm = { t: 0, dur: 7, ang: rnd(0, 6.3) }; toast("DUST STORM!", null, 2); SYN.swoosh(); } }
    }
  }

  // --- enemies + hazards
  for (const e of W.enemies.slice()) tickEnemy(e, dt);
  for (const gl of W.gulls) {
    gl.t += dt;
    if (!gl.hit && gl.t >= gl.dur) {
      gl.hit = true; SYN.swoosh(); cam.shake = Math.max(cam.shake, gl.kind === "meteor" ? 0.5 : 0.2);
      for (let j = 0; j < 14; j++) { const a = rnd(0, 6.3); W.parts.push({ type: "dust", x: gl.x, y: gl.y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 80, life: 0.6, max: 0.6, size: rnd(5, 10), col: Z.kind }); }
      if (Math.hypot(P.x - gl.x, (P.y - gl.y) * 1.5) < (gl.kind === "meteor" ? 62 : 52)) hurtPlayer(2 + (RUN.hard ? 1 : 0), null);
    }
  }
  W.gulls = W.gulls.filter(gl => gl.t < gl.dur + 0.5);

  for (const m of W.microbes) {
    m.turn += rnd(-1, 1) * dt * 3; m.turn *= 0.98; m.ang += m.turn * dt;
    if (Math.hypot(m.x - P.x, m.y - P.y) < 120) m.ang += angDiff(m.ang, Math.atan2(m.y - P.y, m.x - P.x)) * dt * 3;
    m.x += Math.cos(m.ang) * 45 * dt; m.y += Math.sin(m.ang) * 45 * dt;
    if (m.x < 90 || m.x > Z.w - 90 || m.y < 90 || m.y > Z.h - 90) m.ang += angDiff(m.ang, Math.atan2(Z.h / 2 - m.y, Z.w / 2 - m.x)) * dt * 4;
    m.x = clamp(m.x, 40, Z.w - 40); m.y = clamp(m.y, 40, Z.h - 40);
  }
  if (isWater(Z.kind)) {
    W.ambBubT -= dt;
    if (W.ambBubT <= 0) {
      W.ambBubT = Z.kind === "deep" ? 0.35 : 0.18;
      const vw = BW / ZOOM, vh = BH / ZOOM;
      W.parts.push({ type: "bubble", x: cam.x + rnd(-vw / 2, vw / 2), y: cam.y + rnd(-vh / 2, vh / 2), vx: rnd(-6, 6), vy: -rnd(15, 40), life: rnd(1.5, 3), max: 3, size: rnd(1.5, 4) });
      if (Math.random() < 0.06) SYN.bubble(0.02);
    }
  }
  tickParticles(dt);

  // --- meter: smooth bar that always reaches the end (bug fix), then evolve / boss / finish
  W.barShown += (Math.min(RUN.meter, Z.goal) - W.barShown) * (1 - Math.exp(-dt * 8));
  if (!W.bossPhase && !W.complete && RUN.meter >= Z.goal && !P.dead) {
    if (Z.boss) startBoss(); else completeZone();
  }
  if (W.complete > 0) {
    W.barShown = lerp(W.barShown, Z.goal, 0.3);
    W.complete -= dt;
    if (W.complete <= 0) { W.complete = -1; toEvolve(); }
  }
  if (W.bossDead > 0) {
    W.bossDead -= dt;
    if (W.bossDead <= 0) {
      if (W.z === ZONES.length - 1) go(finishGame);
      else { if (W.hits === 0) unlock("untouched"); giveDNA(5); toEvolve(); }
    }
  }
}

function tickEnemy(e, dt) {
  const D = ENEMY[e.type], Z = W.Z;
  e.flash = Math.max(0, e.flash - dt);
  if (e.poisonT > 0) {
    e.poisonT -= dt; e.poisonAcc += e.poisonDps * dt;
    if (e.poisonAcc >= 1) { e.poisonAcc -= 1; damageEnemy(e, 1, "poison"); if (!W.enemies.includes(e)) return; }
  }
  const toP = Math.atan2(P.y - e.y, P.x - e.x), dP = Math.hypot(P.x - e.x, P.y - e.y);
  const R = playerRadius();

// ---------------------------------------------------------------- frame
function drawFrame() {
  G.buttons = []; G._hovered = null;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = true;
  if (G.scene === "menu") drawMenu();
  else if (G.scene === "choose") drawChoose();
  else if (G.scene === "play") { drawWorld(); drawHUD(); }
  else if (G.scene === "evolve") { drawEvolve(); drawVolume(); }
  else if (G.scene === "ending") drawEnding();
  else if (G.scene === "collection") drawCollection();
  else if (G.scene === "shop") drawShop();
  drawAchPop();
  if (!G._hovered) G.hoverId = null;
  if (G.fade > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(0,0,0,${G.fade})`; ctx.fillRect(0, 0, BW, BH); }
  canvas.style.cursor = G._hovered ? "pointer" : "default";
}

let last = 0, acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000 || 0);
  last = now;
  while (acc >= DT) { tick(DT); acc -= DT; }
  draw();
  requestAnimationFrame(frame);
}
if (!window.__ANIMOL_TEST) {
  toMenu();
  if (document.fonts && document.fonts.load) document.fonts.load(`700 40px Fredoka`).catch(() => {});
  requestAnimationFrame(t => { last = t; frame(t); });
}

  drawVolume();
}

// =====================================================================
// PART 4 - PERFORMANCE
// Canvas drawing is slowest when it has to: fill huge screens many times,
// build new gradients every frame, blur things (shadowBlur), or draw
// thousands of tiny paths. So we pre-draw ("bake") things that look the
// same every frame into small hidden canvases (sprites) and just copy them.
// (These functions replace the slower versions with the same names above.)
// =====================================================================
var PERF = { quality: "high", show: false, frameMs: 16.7, upd: 0, ren: 0, slowT: 0, manual: false };
try { if (localStorage.getItem("animol.quality") === "low") { PERF.quality = "low"; PERF.manual = true; } } catch (e) {}
var spriteCache = new Map(), glowCache = new Map(), gradCache = new Map(), txtCache = new Map(), rgbCache = new Map();
var minimapCache = null, silCache = new Map(), causticPat = null, rayGrad = null, TXT_SCALE = 1;
function LOW() { return !!PERF && PERF.quality === "low"; }

// ---- 1. a smaller canvas: cap the pixel ratio and total pixels (fill cost grows with pixels)
function resize() {
  const low = LOW();
  let dpr = Math.min(low ? 1 : 1.5, window.devicePixelRatio || 1);
  const w = window.innerWidth, h = window.innerHeight, maxPx = low ? 1.6e6 : 3.7e6;
  const k = Math.min(1, Math.sqrt(maxPx / Math.max(1, w * dpr * h * dpr)));
  dpr *= k;
  DPR = dpr;
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
  BW = canvas.width = Math.max(1, Math.round(w * dpr));
  BH = canvas.height = Math.max(1, Math.round(h * dpr));
  ZOOM = Math.min(BW / 1050, BH / 650);
  UI = Math.min(BW / 1280, BH / 720);
  VW = BW / UI; VH = BH / UI;
  if (spriteCache) { spriteCache.clear(); txtCache.clear(); silCache.clear(); minimapCache = null; rayGrad = null; }
}
function setWorldTransform() {
  const sx = cam.shake > 0 ? (Math.random() - 0.5) * cam.shake * 14 : 0, sy = cam.shake > 0 ? (Math.random() - 0.5) * cam.shake * 14 : 0;
  ctx.setTransform(ZOOM, 0, 0, ZOOM, BW / 2 - cam.x * ZOOM + sx * DPR, BH / 2 - cam.y * ZOOM + sy * DPR);
  TXT_SCALE = ZOOM;
}
function setUITransform() { ctx.setTransform(UI, 0, 0, UI, 0, 0); TXT_SCALE = UI; }

// ---- 2. cached gradients (only ones in a creature's own small coordinates; those never change)
function radial(g, x, y, r, stops, lx = -0.35, ly = -0.4) {
  const cacheable = Math.abs(x) < 200 && Math.abs(y) < 200;
  let key;
  if (cacheable) {
    key = x + "," + y + "," + r + "," + lx + "," + ly + "," + stops.join("|");
    const c = gradCache.get(key); if (c) return c;
  }
  const gr = g.createRadialGradient(x + lx * r, y + ly * r, r * 0.08, x, y, r * 1.05);
  for (let i = 0; i < stops.length; i++) gr.addColorStop(i / (stops.length - 1), stops[i]);
  if (cacheable) { if (gradCache.size > 1500) gradCache.clear(); gradCache.set(key, gr); }
  return gr;
}
// the body light direction is rounded to 64 steps so its gradient can be reused
function drawBody(g, R, ang, L) {
  const q = Math.round(((-ang % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / (Math.PI / 32)) * (Math.PI / 32);
  const lx = Math.round((Math.cos(q) * -0.35 - Math.sin(q) * -0.42) * 100) / 100, ly = Math.round((Math.sin(q) * -0.35 + Math.cos(q) * -0.42) * 100) / 100;
  const squash = 1 + Math.sin(L.t * 9) * 0.025 * (L.moving || 0);
  g.save(); g.scale(squash, 1 / squash);
  circle(g, 0, 0, R);
  strokeFill(g, radial(g, 0, 0, R, COL.body, lx, ly), COL.line, 3);
  g.fillStyle = "rgba(4,100,40,.28)";
  g.beginPath(); g.arc(-9, 6, 3, 0, 6.3); g.moveTo(-1, 12); g.arc(-3, 12, 2.2, 0, 6.3); g.moveTo(-10.6, -4); g.arc(-13, -4, 2.4, 0, 6.3); g.moveTo(3.8, -13); g.arc(2, -13, 1.8, 0, 6.3); g.moveTo(-4.5, -10); g.arc(-6, -10, 1.5, 0, 6.3); g.fill();
  g.beginPath(); g.ellipse(lx * R * 0.55, ly * R * 0.55, R * 0.32, R * 0.18, Math.atan2(ly, lx) + Math.PI / 2, 0, Math.PI * 2);
  g.fillStyle = "rgba(255,255,255,.35)"; g.fill();
  g.restore();
}

// ---- 3. glow sprites instead of shadowBlur / per-frame glow gradients
function glowSprite(rgb) {
  let c = glowCache.get(rgb); if (c) return c;
  c = makeCanvas(64, 64); const g = c.getContext("2d");
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(0.35, `rgba(${rgb},.45)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  glowCache.set(rgb, c); return c;
}
function glowAt(g, x, y, r, rgb, a) {
  const op = g.globalCompositeOperation, pa = g.globalAlpha;
  g.globalCompositeOperation = "lighter"; g.globalAlpha = pa * a;
  g.drawImage(glowSprite(rgb), x - r, y - r, r * 2, r * 2);
  g.globalCompositeOperation = op; g.globalAlpha = pa;
}
function drawFeelers(g, R, L) {
  for (const s of [-1, 1]) {
    const tx = R + 18, ty = s * (R * 0.95 + 4 + Math.sin(L.t * 3 + s) * 3);
    g.beginPath(); g.moveTo(R * 0.55, s * R * 0.72); g.quadraticCurveTo(R + 4, s * (R + 8), tx, ty);
    g.lineWidth = 4; g.strokeStyle = COL.line; g.stroke(); g.lineWidth = 2; g.strokeStyle = "#d9c24a"; g.stroke();
    glowAt(g, tx, ty, 12, "255,242,122", 0.9);
    circle(g, tx, ty, 3.6); g.fillStyle = "#fff59a"; g.fill();
  }
}
function drawGlowSpots(g, R, L) {
  if (LOW()) return;
  [[-10, 7], [-4, -12], [-14, -3], [2, 13], [-8, -1], [6, -4]].forEach(([x, y], i) => glowAt(g, x, y, 5, "140,255,240", 0.9 * (0.55 + 0.45 * Math.sin(L.t * 3 + i))));
}
function drawAura(g, R, L) { if (!LOW()) glowAt(g, 0, 0, R + 24, "255,210,70", 0.45 * (0.6 + 0.4 * Math.sin(L.t * 4))); }
function drawRegenGlow(g, R, L, lvl) { if (!LOW()) glowAt(g, 0, 0, R + 10, "90,255,140", 0.2 * lvl * (0.5 + 0.5 * Math.sin(L.t * 2.5))); }
function drawPoison(g, R, L, lvl) {
  for (const s of [-1, 1]) {
    const y = s * 7, x = R + 10 + Math.sin(L.t * 3 + s) * 1.5, drip = (L.t * 1.2 + (s + 1) * 0.3) % 1;
    glowAt(g, x, y + drip * 6 * s, 5 + lvl, "200,90,255", 0.8 - drip * 0.5);
  }
}
function drawDeepJellies() {
  if (LOW()) return;
  const g = ctx, Z = W.Z, t = G.t;
  for (const j of deepJellies) {
    const x = j.x * Z.w + (cam.x - Z.w / 2) * 0.35, y = ((j.y * Z.h - t * 8 * j.s) % Z.h + Z.h) % Z.h + (cam.y - Z.h / 2) * 0.35;
    const pulse = 0.6 + 0.4 * Math.sin(t * 2 + j.p), r = 16 * j.s;
    glowAt(g, x, y, r * 3, j.c, 0.3 * pulse);
    g.save(); g.globalCompositeOperation = "lighter";
    g.beginPath(); g.arc(x, y, r, Math.PI, 0); g.closePath(); g.globalAlpha = 0.35 * pulse; g.fillStyle = rgbStr(j.c); g.fill();
    g.globalAlpha = 0.25 * pulse; g.strokeStyle = rgbStr(j.c); g.lineWidth = 2; g.beginPath();
    for (let k = -2; k <= 2; k++) { g.moveTo(x + k * r * 0.35, y); g.quadraticCurveTo(x + k * r * 0.4 + Math.sin(t * 2 + k) * 5, y + r, x + k * r * 0.3, y + r * 2); }
    g.stroke(); g.restore();
  }
}
function drawDarkness() {
  const g = ctx, p = worldToScreen(P.x, P.y), t = G.t;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  const R = (300 + (RUN.stats.eat >= 2 ? 60 : 0)) * ZOOM;
  const gr = g.createRadialGradient(p.x, p.y, R * 0.18, p.x, p.y, R);
  gr.addColorStop(0, "rgba(0,2,12,0)"); gr.addColorStop(0.55, "rgba(0,2,12,.55)"); gr.addColorStop(1, "rgba(0,2,12,.94)");
  g.fillStyle = gr; g.fillRect(0, 0, BW, BH);
  for (const e of W.enemies) if (e.type === "angler") {
    const lx = 30 + Math.sin(t * 2 + e.seed) * 4, ly = -30 + Math.cos(t * 1.7 + e.seed) * 3, c = Math.cos(e.ang), s = Math.sin(e.ang), sc = e.scale || 1;
    const q = worldToScreen(e.x + (c * lx - s * ly) * sc, e.y + (s * lx + c * ly) * sc);
    glowAt(g, q.x, q.y, 60 * ZOOM * sc * (0.85 + 0.15 * Math.sin(t * 4 + e.seed)), "255,245,140", 0.95);
  }
  for (const f of W.food) { const q = worldToScreen(f.x, f.y); if (q.x > -50 && q.y > -50 && q.x < BW + 50 && q.y < BH + 50) glowAt(g, q.x, q.y, 22 * ZOOM, f.sprite === "meat" ? "255,100,160" : "90,255,140", 0.45); }
  g.restore();
}

// ---- 4. food is baked into sprites (drawn once per look, then copied)
function foodSprite(f) {
  const s = Math.max(1, Math.round(ZOOM * 2) / 2), key = f.sprite + f.v + "|" + s;
  let c = spriteCache.get(key); if (c) return c;
  c = makeCanvas(44 * s, 44 * s); const g = c.getContext("2d");
  g.scale(s, s);
  drawFoodBase(g, { sprite: f.sprite, v: f.v, x: 22, y: 22, rot: 0, age: 1, glow: false }, 0);
  spriteCache.set(key, c); return c;
}
function drawFood(g, f, t) {
  const pop = f.age < 0.35 ? easeOutBack(f.age / 0.35) : 1;
  g.save(); g.translate(f.x, f.y); g.scale(pop, pop);
  g.rotate(f.rot + Math.sin(t * 1.5 + f.x) * 0.08);
  g.drawImage(foodSprite(f), -22, -22, 44, 44);
  g.restore();
}

// ---- 5. particles: no new color strings every frame, capped and recycled in place
function rgbStr(c) { let s = rgbCache.get(c); if (!s) { s = "rgb(" + c + ")"; rgbCache.set(c, s); } return s; }
function drawParticles(g) {
  const pa = g.globalAlpha;
  for (const p of W.parts) {
    const a = Math.max(0, p.life / p.max);
    if (p.type === "dot") { g.globalAlpha = a; g.fillStyle = rgbStr(p.col); g.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    else if (p.type === "spark") { g.globalAlpha = a; g.strokeStyle = rgbStr(p.col); g.lineWidth = 2.5; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); g.stroke(); }
    else if (p.type === "bubble") {
      g.globalAlpha = Math.min(1, a * 1.5) * 0.75; circle(g, p.x, p.y, p.size); g.strokeStyle = "#dcf5ff"; g.lineWidth = 1.2; g.stroke();
      g.globalAlpha = a * 0.8; g.fillStyle = "#fff"; g.fillRect(p.x - p.size * 0.55, p.y - p.size * 0.55, p.size * 0.5, p.size * 0.5);
    } else if (p.type === "ring") {
      g.globalAlpha = a * 0.9; circle(g, p.x, p.y, lerp(p.r, p.r1, 1 - a)); g.strokeStyle = rgbStr(p.col); g.lineWidth = 4 * a + 1; g.stroke();
    }
  }
  g.globalAlpha = pa;
}
function tickParticles(dt) {
  const ps = W.parts; let j = 0;
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    p.life -= dt;
    if (p.type === "bubble") { p.x += (p.vx + Math.sin(p.life * 6) * 12) * dt; p.y += p.vy * dt; }
    else if (p.vx !== undefined) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; }
    if (p.life > 0) ps[j++] = p;
  }
  ps.length = j;
  const cap = LOW() ? 160 : 450;
  if (ps.length > cap) ps.splice(0, ps.length - cap);
  const pp = W.popups; j = 0;
  for (let i = 0; i < pp.length; i++) { const p = pp[i]; p.t -= dt; p.y -= 30 * dt; if (p.t > 0) pp[j++] = p; }
  pp.length = j;
  if (pp.length > 30) pp.splice(0, pp.length - 30);
}
function drawSnow() {
  if (LOW()) return;
  const g = ctx, Z = W.Z;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = Z.kind === "moon" ? "#dcdeeb" : Z.kind === "mars" ? "#ffaa78" : Z.kind === "land" ? "#fffadc" : Z.kind === "deep" ? "#96dcff" : "#e6faff";
  const vy = Z.kind === "land" ? -4 : 10;
  for (const s of W.snow) {
    const x = ((s.x * BW - cam.x * ZOOM * s.d + G.t * 6 * DPR) % BW + BW) % BW;
    const y = ((s.y * BH - cam.y * ZOOM * s.d + G.t * vy * DPR * s.d) % BH + BH) % BH;
    g.globalAlpha = 0.12 + s.d * 0.3;
    g.fillRect(x, y, s.s * DPR * s.d, s.s * DPR * s.d);
  }
  g.restore();
}
var shadowStr = {};
function shadow(g, x, y, rx, ry, a = 0.22) {
  const k = Math.round(a * 100);
  g.fillStyle = shadowStr[k] || (shadowStr[k] = `rgba(0,10,30,${k / 100})`);
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill();
}

// ---- 6. text is drawn once into a sprite and reused (text drawing is slow, glowing text even more)
function txt(s, x, y, size, fill, opts = {}) {
  s = String(s);
  const sc = Math.max(0.5, Math.round(TXT_SCALE * 4) / 4);
  const key = s + "|" + size + "|" + fill + "|" + (opts.stroke || "") + "|" + (opts.lw || "") + "|" + (opts.weight || 700) + "|" + (opts.glow || "") + "|" + (opts.blur || "") + "|" + sc;
  let e = txtCache.get(key);
  if (!e) {
    const font = `${opts.weight || 700} ${size}px ${FONT}`;
    ctx.font = font;
    const w = ctx.measureText(s).width || s.length * size * 0.55;
    const pad = (opts.stroke ? (opts.lw || size * 0.16) : 0) + (opts.glow ? (opts.blur || 18) * 1.6 : 0) + 4;
    const cw = w + pad * 2, ch = size * 1.5 + pad * 2;
    const c = makeCanvas(cw * sc, ch * sc), g = c.getContext("2d");
    g.scale(sc, sc); g.font = font; g.textAlign = "center"; g.textBaseline = "middle";
    if (opts.stroke) { g.lineJoin = "round"; g.lineWidth = opts.lw || size * 0.16; g.strokeStyle = opts.stroke; g.strokeText(s, cw / 2, ch / 2); }
    if (opts.glow) { g.shadowColor = opts.glow; g.shadowBlur = (opts.blur || 18) * sc; }
    g.fillStyle = fill; g.fillText(s, cw / 2, ch / 2);
    e = { c, cw, ch, w };
    if (txtCache.size > 500) txtCache.clear();
    txtCache.set(key, e);
  }
  const align = opts.align || "center";
  const cx = align === "left" ? x + e.w / 2 : align === "right" ? x - e.w / 2 : x;
  ctx.drawImage(e.c, cx - e.cw / 2, y - e.ch / 2, e.cw, e.ch);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (txtCache) txtCache.clear(); }).catch(() => {});

// ---- 7. cached caustic pattern, god-ray gradient, minimap background, collection silhouettes
function causticPattern(g) { if (!causticPat) causticPat = g.createPattern(getCaustics(), "repeat"); return causticPat; }
function rayGradient(g) {
  if (!rayGrad || rayGrad.h !== BH) { rayGrad = g.createLinearGradient(0, 0, 0, BH); rayGrad.addColorStop(0, "rgba(255,255,230,.06)"); rayGrad.addColorStop(1, "rgba(255,255,230,0)"); rayGrad.h = BH; }
  return rayGrad;
}
function minimapBase(w, h) {
  const s = UI, key = W.z + "|" + Math.round(w * s) + "|" + Math.round(h * s);
  if (minimapCache && minimapCache.key === key) return minimapCache.c;
  const c = makeCanvas(w * s, h * s), g = c.getContext("2d");
  g.globalAlpha = 0.5; g.drawImage(W.floor.canvas, 0, 0, w * s, h * s);
  minimapCache = { key, c };
  return c;
}
function silhouette(type, title) {
  const s = Math.max(1, Math.round(UI * 2) / 2), key = type + title + s;
  let c = silCache.get(key); if (c) return c;
  c = makeCanvas(180 * s, 180 * s); const g = c.getContext("2d");
  g.scale(s, s);
  drawCreature(g, 90, 90, -0.3, 1.25, creatureLook(type, FORM_STATS[title], { evolved: true, legs: true, helmet: true, moving: 0.4, walk: 1, t: 1 }));
  g.globalCompositeOperation = "source-in"; g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0, 0, 180, 180);
  silCache.set(key, c); return c;
}

// ---- 8. FPS counter (F3) and automatic low-quality mode
function setQuality(q, auto) {
  PERF.quality = q; PERF.slowT = 0; PERF.manual = !auto;
  try { localStorage.setItem("animol.quality", q); } catch (e) {}
  resize();
  if (q === "low" && W) W.parts.length = Math.min(W.parts.length, 160);
  toast(auto ? "Switched to low quality (the game was lagging)" : "Quality: " + q.toUpperCase(), auto ? "Press F4 to switch back" : null, 3);
}
window.addEventListener("keydown", e => {
  if (e.code === "F3") { PERF.show = !PERF.show; e.preventDefault(); }
  if (e.code === "F4") { setQuality(LOW() ? "high" : "low", false); e.preventDefault(); }
});
function perfSample(dtms, u, r) {
  if (dtms > 0 && dtms < 100) PERF.frameMs += (dtms - PERF.frameMs) * 0.05;
  PERF.upd += (u - PERF.upd) * 0.05; PERF.ren += (r - PERF.ren) * 0.05;
  if (G.scene === "play" && !G.paused && !G.fadeDir && !LOW() && !PERF.manual && dtms > 0 && dtms < 100) {
    if (PERF.frameMs > 20) PERF.slowT += dtms / 1000; else PERF.slowT = Math.max(0, PERF.slowT - dtms / 2000);
    if (PERF.slowT > 3) setQuality("low", true);
  }
}
function drawPerf() {
  setUITransform();
  const fps = 1000 / Math.max(1, PERF.frameMs);
  panel(VW - 210, 122, 190, 104, { r: 14, fill: "rgba(0,0,0,.7)" });
  txt(`${fps.toFixed(0)} FPS  (${PERF.frameMs.toFixed(1)} ms)`, VW - 198, 140, 15, fps > 50 ? "#7dffa0" : fps > 30 ? "#ffe066" : "#ff6b6b", { align: "left" });
  txt(`update ${PERF.upd.toFixed(2)} ms`, VW - 198, 162, 13, "#cfe7ff", { align: "left", weight: 500 });
  txt(`draw ${PERF.ren.toFixed(2)} ms`, VW - 198, 180, 13, "#cfe7ff", { align: "left", weight: 500 });
  txt(`${BW}x${BH}  ${PERF.quality}  ${W ? W.parts.length : 0}p`, VW - 198, 198, 13, "#cfe7ff", { align: "left", weight: 500 });
  txt("F3 hide  ·  F4 quality", VW - 198, 214, 11, "#8aa", { align: "left", weight: 500 });
}
function draw() {
  drawFrame();
  if (PERF.show) drawPerf();
}
function frame(now) {
  const dtms = now - last;
  acc += Math.min(0.1, dtms / 1000 || 0);
  last = now;
  const t0 = performance.now();
  let steps = 0;
  while (acc >= DT && steps < 6) { tick(DT); acc -= DT; steps++; }   // never more than 6 catch-up steps (avoids a slow-down spiral)
  if (steps >= 6) acc = 0;
  const t1 = performance.now();
  draw();
  perfSample(dtms, t1 - t0, performance.now() - t1);
  requestAnimationFrame(frame);
}
resize();

</script>
